<text x="1450" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172c47"><tspan x="1450" dy="0">Ngoại lệ giao ngựa:</tspan><tspan x="1450" dy="20">quản lý duyệt;</tspan><tspan x="1450" dy="20">điều phối hoặc</tspan><tspan x="1450" dy="20">quản lý mở.</tspan></text>
<text x="32" y="1450" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172c47"><tspan x="32" dy="0">(*) Mỗi vai trò sử dụng các chức năng chung phù hợp; đăng ký chỉ tạo CUSTOMER. Các use case được gom theo mục tiêu.</tspan></text>
<text x="32" y="1477" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172c47"><tspan x="32" dy="0">Tài xế / hộ tống được phân biệt bằng vai trò tổ lái trong chuyến. VNPay là hệ thống ngoài; chế độ mô phỏng chỉ phục vụ thử nghiệm.</tspan></text></svg>