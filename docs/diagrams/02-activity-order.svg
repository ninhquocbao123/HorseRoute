<text x="35" y="2116" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172c47"><tspan x="35" dy="0">Luồng duyệt đơn và luồng kết luận thẩm định có trạng thái riêng. Giấy tờ có sẵn trong hồ sơ ngựa vẫn cần chuyên viên duyệt.</tspan></text>
<text x="35" y="2139" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172c47"><tspan x="35" dy="0">Sau khi đơn APPROVED, báo giá và lập kế hoạch có thể diễn ra độc lập với thẩm định; không có cổng bắt buộc thẩm định APPROVED ở bước chuyển READY.</tspan></text></svg>