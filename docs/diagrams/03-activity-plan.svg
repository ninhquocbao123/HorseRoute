<text x="35" y="2478" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172c47"><tspan x="35" dy="0">Thiếu cọc / tờ khai có thể được quản lý cho ngoại lệ có lý do và lưu audit. READY chưa phải IN_TRANSIT: tài xế phải ghi mốc xuất phát.</tspan></text></svg>