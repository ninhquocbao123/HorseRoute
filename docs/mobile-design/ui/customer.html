<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HorseRoute Khách hàng UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh công cụ dính trên cùng; chế độ Bấm thử = khung điện thoại + ghi chú; chế độ Xem tất cả = mỗi màn một hàng biến thể. */
:root{
  --page-bg:#eef3f2; --page-fg:#0d2a2e; --page-muted:#546d71; --page-line:#d3e1e1; --page-card:#ffffff; --page-brand:#0b3b42; --page-on-brand:#ffffff; --page-seg:#e1ebea;
  /* Bên trong khung: màu thương hiệu xanh #0b3b42, vàng #f4b942, trắng (00-context mục 5b); giữ một kiểu ở cả hai chế độ sáng/tối */
  --w-ink:#0b3b42; --w-ink2:#546d71; --w-ink3:#8aa3a6; --w-line:#d8e6e6; --w-fill:#e7f1f1; --w-fill2:#f6faf9; --w-bg:#ffffff; --w-dark:#0b3b42; --w-brand2:#14606a; --w-on-dark:#ffffff; --w-on-dark2:#b9d3d6; --w-shade:rgba(6,20,22,.5);
  --acc:#f4b942; --on-acc:#2b1a00;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}
html,body{background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page-card)}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #2f7c87;outline-offset:2px}

/* ---------- Thanh công cụ (ngoài khung) ---------- */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page-card);border-bottom:1px solid var(--page-line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.tb h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tb h1 small{font-weight:500;color:var(--page-muted);font-size:13px}
.tb .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb .lab{font-size:12px;color:var(--page-muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--page-seg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--page-fg);font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--page-brand);color:var(--page-on-brand)}
.tbtn{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:10px;padding:6px 12px;font-size:13px;min-height:38px;cursor:pointer}
.spacer{flex:1}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* ---------- Chế độ Bấm thử ---------- */
.proto{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.device{background:#0c2326;border-radius:52px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.device .screen{border-radius:40px}
.device.android{border-radius:28px;padding:10px}
.device.android .screen{border-radius:18px}
.fit{position:relative;flex:none}
.fit>.scaled{transform-origin:0 0;position:absolute;left:0;top:0}
.panel{flex:1 1 320px;max-width:440px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:18px;text-wrap:balance}
.pcard h3{margin:0;font-size:13px;font-weight:600;color:var(--page-muted);letter-spacing:.04em;text-transform:uppercase}
.pcard p,.pcard li{margin:0;font-size:14px;line-height:1.55}
.pcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--page-muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.jump button.on{border-color:var(--page-brand);background:var(--page-seg);font-weight:600}
.jump button .code{color:var(--page-muted);margin-right:6px}
.hint{font-size:13px;color:var(--page-muted)}

/* ---------- Chế độ Xem tất cả ---------- */
.grid{display:flex;flex-direction:column;gap:40px}
.grow-row{display:flex;flex-direction:column;gap:12px}
.grow-row>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.grow-row>header h2{margin:0;font-size:20px}
.grow-row>header p{margin:0;color:var(--page-muted);font-size:14px;max-width:70ch}
.strip{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.vcell{display:flex;flex-direction:column;gap:8px;flex:none}
.vcell .vl{font-size:13px;font-weight:600;max-width:390px}
.vcell .fit{border:1px solid var(--page-line);border-radius:6px;overflow:hidden;cursor:zoom-in}

/* Token vai trò (tokens/theme.ts), gắn vào khung màn; nút Giao diện đổi sang bộ tối */
.screen{--bg:#f6faf9;--surface:#ffffff;--surfaceMuted:#e7f1f1;--surfaceElevated:#ffffff;--surfaceBrand:#0b3b42;--surfaceBrandAlt:#14606a;--onBrand:#ffffff;--onBrandMuted:#b9d3d6;--textPrimary:#0d2a2e;--textSecondary:#546d71;--textDisabled:#94a8a9;--border:#d8e6e6;--borderInput:#738a8d;--borderStrong:#0b3b42;--accent:#f4b942;--accentPressed:#ce9025;--onAccent:#2b1a00;--accentText:#7b4e00;--accentSubtle:#fef9ec;--link:#14606a;--focusRing:#14606a;--tabActive:#0b3b42;--tabInactive:#546d71;--successFg:#166534;--successBg:#eaf6ee;--successSolid:#166534;--warningFg:#a24a05;--warningBg:#fdf1e4;--warningSolid:#b45309;--dangerFg:#b42318;--dangerBg:#fdeceb;--dangerSolid:#dc2626;--infoFg:#14606a;--infoBg:#f2f8f8;--infoSolid:#14606a;--neutralFg:#546d71;--neutralBg:#e7f0f0;--overlay:rgba(6,20,22,0.48);--shadow-md:0 -4px 12px rgba(11,59,66,.06);--shadow-lg:0 12px 32px rgba(11,59,66,.10)}
body[data-ft="dark"] .screen{--bg:#061416;--surface:#0c2326;--surfaceMuted:#08191b;--surfaceElevated:#133034;--surfaceBrand:#104d56;--surfaceBrandAlt:#14606a;--onBrand:#ffffff;--onBrandMuted:#b9d3d6;--textPrimary:#e8f4f4;--textSecondary:#96b4b7;--textDisabled:#55716f;--border:#1a3a3e;--borderInput:#56777a;--borderStrong:#96b4b7;--accent:#f4b942;--accentPressed:#f5c76d;--onAccent:#2b1a00;--accentText:#f5c76d;--accentSubtle:#2a2410;--link:#7cc7cf;--focusRing:#7cc7cf;--tabActive:#e8f4f4;--tabInactive:#96b4b7;--successFg:#6fd39a;--successBg:#0f2a1e;--successSolid:#17753f;--warningFg:#f3a35c;--warningBg:#2e1f0f;--warningSolid:#b45309;--dangerFg:#ff8a80;--dangerBg:#341514;--dangerSolid:#dc2626;--infoFg:#7cc7cf;--infoBg:#0f2e33;--infoSolid:#14606a;--neutralFg:#96b4b7;--neutralBg:#12302f;--overlay:rgba(0,0,0,0.6);--shadow-md:none;--shadow-lg:none}
/* ---------- Khung màn (UI chi tiết, chỉ dùng token của 05-design-system / tokens/theme.ts) ---------- */
/* Biến cũ của wireframe trỏ về token vai trò để các khối CSS riêng của từng actor tự đổi theo sáng/tối */
.screen{--w-ink:var(--textPrimary);--w-ink2:var(--textSecondary);--w-ink3:var(--textSecondary);--w-line:var(--border);--w-fill:var(--surfaceMuted);--w-fill2:var(--bg);--w-bg:var(--surface);--w-dark:var(--surfaceBrand);--w-brand2:var(--surfaceBrandAlt);--w-on-dark:var(--onBrand);--w-on-dark2:var(--onBrandMuted);--w-shade:var(--overlay);--acc:var(--accent);--on-acc:var(--onAccent)}
.screen{width:var(--fw);height:var(--fh);display:flex;flex-direction:column;background:var(--bg);color:var(--textPrimary);font-family:var(--font);font-size:16px;line-height:24px;position:relative;overflow:hidden;text-align:left;-webkit-font-smoothing:antialiased}
.screen *{box-sizing:border-box}
.sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:600;font-size:15px;background:var(--surface);color:var(--textPrimary)}
.android .sb{height:28px;padding:0 16px;font-size:13px}
.sbi{display:flex;align-items:center;gap:6px}
.sbi .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;display:flex;padding:1.5px}
.sbi .bat span{width:70%;background:currentColor;border-radius:1px}
.sbi .sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sbi .sig span{width:3px;background:currentColor;border-radius:1px}
.hi{height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.hi span{width:134px;height:5px;border-radius:3px;background:var(--textPrimary)}
.android .hi{height:24px} .android .hi span{width:108px;height:4px}
/* NavigationHeader */
.hdr{min-height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--border);background:var(--surface)}
.hdr .t{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 4px}
.hdr .t b{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{font-size:13px;line-height:18px;color:var(--textSecondary)}
.hdr.big{min-height:0;padding:4px 16px 12px;border-bottom:0;align-items:flex-end}
.hdr.big .t{padding:0}
.hdr.big .t b{font-size:34px;line-height:42px;font-weight:700;letter-spacing:-.4px;white-space:normal}
.hdr.big .t small{font-size:13px;line-height:19px}
.ib{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px;background:none;border:0;color:inherit;cursor:pointer;padding:0;position:relative}
.ib:active{background:var(--surfaceMuted)}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}
.body.white{background:var(--surface)}
.bottom{flex:none;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow-md)}
.bottom .row{display:flex;gap:8px;padding:12px 16px 4px}
.bottom .row[style*="flex-direction:column"]{align-items:stretch}
.bottom .note{padding:12px 16px 0;font-size:13px;line-height:19px;color:var(--textSecondary)}
/* Button */
.btn{min-height:48px;border-radius:12px;font-family:var(--font);font-weight:600;font-size:17px;line-height:22px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border:1.5px solid var(--borderStrong);background:var(--surface);color:var(--textPrimary);cursor:pointer;text-align:center;text-decoration:none;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98);background:var(--surfaceMuted)}
.btn.pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btn.pri:active{background:var(--accentPressed);border-color:var(--accentPressed)}
.btn.xl{min-height:64px;font-size:18px;line-height:24px;border-radius:16px}
.btn.grow{flex:1;min-width:0}
.btn.side{width:104px;flex:none;flex-direction:column;gap:2px;font-size:15px;line-height:20px;padding:0 8px;background:var(--surface);color:var(--dangerFg);border-color:var(--dangerFg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--link)}
.btn.danger{background:var(--dangerSolid);border-color:var(--dangerSolid);color:#fff}
.btn[disabled]{background:var(--surfaceMuted);color:var(--textDisabled);border-color:transparent;cursor:default;transform:none}
/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tap{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card.tap:active{background:var(--surfaceMuted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
/* chip = StatusBadge mặc định; .chip.dark = tone brand; .chip.fill = tone info */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:999px;border:0;font-size:13px;line-height:18px;font-weight:600;background:var(--neutralBg);color:var(--neutralFg);white-space:nowrap}
.chip.dark{background:var(--surfaceBrand);color:var(--onBrand)}
.chip.fill{background:var(--infoBg);color:var(--infoFg)}
.chip.t-success{background:var(--successBg);color:var(--successFg)}
.chip.t-warning{background:var(--warningBg);color:var(--warningFg)}
.chip.t-danger{background:var(--dangerBg);color:var(--dangerFg)}
.chip.t-info{background:var(--infoBg);color:var(--infoFg)}
.chip.t-brand{background:var(--surfaceBrand);color:var(--onBrand)}
.chip.sm{height:22px;font-size:12px;padding:0 8px 0 6px;gap:4px}
.lbl{font-size:12px;line-height:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--textSecondary)}
.muted{color:var(--textSecondary)} .small{font-size:13px;line-height:19px}
.big{font-size:24px;font-weight:700;line-height:32px;letter-spacing:-.2px;text-wrap:balance}
.opts{display:flex;flex-wrap:wrap;gap:8px}
/* ChoiceChip */
.opt{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--borderInput);background:var(--surface);font-family:var(--font);font-weight:500;font-size:15px;line-height:20px;color:var(--textPrimary);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opt.on{border-color:var(--surfaceBrand);background:var(--surfaceBrand);color:var(--onBrand)}
/* Chọn không đổi kích thước chip: chỉ đổi nền, không thêm dấu tick, không đổi độ đậm */
.opt>svg{display:none}
/* Lựa chọn lớn (thẻ chọn) */
.bigopt{min-height:72px;width:100%;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 16px;font-family:var(--font);color:var(--textPrimary);text-align:left;cursor:pointer}
.bigopt.on{border:2px solid var(--borderStrong);background:var(--surfaceMuted);padding:11.5px 15.5px}
.bigopt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bigopt .tx b{font-size:17px;line-height:24px;font-weight:600}
.bigopt .tx span{font-size:13px;line-height:19px;color:var(--textSecondary)}
.bigopt>svg:last-child{color:var(--link)}
.ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--surfaceMuted);display:flex;align-items:center;justify-content:center;color:var(--textPrimary)}
.bigopt.on .ico{background:var(--surfaceBrand);color:var(--onBrand)}
.sevm{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none;color:var(--neutralFg)}
.sevm.s2{color:var(--warningFg)} .sevm.s3{color:var(--dangerFg)}
.sevm span{width:6px;border-radius:2px;background:currentColor;opacity:.22}
.sevm span.f{opacity:1}
/* TabBar */
.tabbar{flex:none;display:flex;border-top:1px solid var(--border);background:var(--surface)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 2px;font-size:11px;line-height:14px;font-weight:500;color:var(--tabInactive);background:none;border:0;cursor:pointer;font-family:var(--font);min-height:56px;position:relative}
.tab.on{color:var(--tabActive);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
/* BottomSheet / Dialog */
.overlay{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.overlay.center{justify-content:center;padding:20px}
.sheet{background:var(--surfaceElevated);border-radius:24px 24px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);max-height:92%;overflow-y:auto}
.sheet .hi{background:transparent}
.grab{width:36px;height:5px;border-radius:5px;background:var(--borderInput);align-self:center;flex:none}
.dialog{background:var(--surfaceElevated);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)}
.sheet h3,.dialog h3{margin:0;font-size:20px;line-height:28px;font-weight:600}
.kvw{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.kvw>div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--border);align-items:center;min-height:48px}
.kvw>div:first-child{border-top:0}
.kvw span:first-child{color:var(--textSecondary);font-size:15px}
.kvw b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--link);cursor:pointer;min-height:44px}
.card.brand .link,.card.grad .link{color:var(--onBrand)}
/* Hộp thông báo trong nội dung */
.box{border:1px solid var(--border);background:var(--infoBg);color:var(--infoFg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;font-size:15px;line-height:22px;align-items:flex-start}
.box>svg{flex:none;margin-top:1px}
.box b{color:inherit}
.box.err{border:1px solid var(--dangerFg);background:var(--dangerBg);color:var(--dangerFg)}
.box.err .link{color:var(--dangerFg)}
.box.warn{border-color:transparent;background:var(--warningBg);color:var(--warningFg)}
.skel{background:var(--surfaceMuted);border-radius:8px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 55%,transparent),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
/* Ảnh giữ chỗ: nền trung tính, không minh họa */
.hatch{background:linear-gradient(135deg,var(--surfaceMuted),color-mix(in srgb,var(--textSecondary) 35%,var(--surfaceMuted)));border:0;border-radius:12px;color:var(--textPrimary)}
/* Banner */
.bar{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;min-height:44px;background:var(--surfaceBrand);color:var(--onBrand);font-size:15px;line-height:20px;font-weight:500;flex:none;border:0;width:100%;font-family:var(--font);text-align:left;cursor:pointer}
.bar .grow{flex:1;min-width:0}
.bar.light{background:var(--infoBg);color:var(--infoFg);cursor:default}
.bar.warn{background:var(--warningBg);color:var(--warningFg)}
.card.brand{background:var(--surfaceBrand);border-color:var(--surfaceBrand);color:var(--onBrand)}
.card.brand .lbl,.card.brand .muted{color:var(--onBrandMuted)}
.card.brand .chip{background:rgba(255,255,255,.14);color:var(--onBrand)}
.card.brand .chip.t-warning{background:var(--warningBg);color:var(--warningFg)}
.card.brand .chip.dark{background:var(--accent);color:var(--onAccent)}
/* Toast Hoàn tác */
.undo{margin:12px 12px 0;background:var(--surfaceBrand);color:var(--onBrand);border-radius:16px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;min-height:60px;box-shadow:var(--shadow-lg)}
.undo .grow{flex:1;min-width:0;font-size:15px;line-height:21px}
.undo button{min-height:48px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--accent);font-family:var(--font);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
/* StopTimeline */
.tl{display:flex;flex-direction:column}
.stop{display:flex;gap:12px}
.rail{width:24px;flex:none;display:flex;flex-direction:column;align-items:center}

document.addEventListener('click', e => {
  const seg = e.target.closest('[data-mode],[data-plat],[data-st],[data-sc],[data-jump],[data-open],[data-order]');
  if (seg) {
    const d = seg.dataset;
    if (d.mode) mode = d.mode;
    else if (d.plat) plat = d.plat;
    else if (d.st) app.st = d.st;
    else if (d.sc) gridScale = +d.sc;
    else if (d.order) app.order = d.order;
    else if (d.jump) jumpTo(d.jump);
    else if (d.open) { mode = 'proto'; jumpTo(d.open); window.scrollTo(0,0); }
    render(); return;
  }
  if (mode !== 'proto') return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !main.contains(t)) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg); render(); }
});
function jumpTo(code){

  if (code === 'CUS-06') { app.stack = ['CUS-01','CUS-05']; app.horse = 'Kim Long'; app.screen = code; return; }
  if (code === 'CUS-03') { app.stack = ['CUS-02']; app.order = 'HR-2610-0009'; app.screen = code; return; }
  if (code === 'CUS-04') { app.stack = ['CUS-02','CUS-03']; app.order = 'HR-2610-0015'; app.screen = code; return; }
  if (code === 'CUS-09') { app.stack = ['CUS-08']; app.horse = 'Hồng Vân'; app.screen = code; return; }
  if (code === 'CUS-10') { app.stack = ['CUS-08']; app.editing = false; app.screen = code; return; }
  const wiz = ['CUS-11','CUS-12','CUS-13','CUS-14'];
  if (wiz.includes(code)) { app.stack = ['CUS-02'].concat(wiz.slice(0, wiz.indexOf(code))); if (code !== 'CUS-11' && app.req.horses.length < 2) app.req = {...REQ_FULL}; app.screen = code; return; }
  if (code === 'CUS-15') { app.stack = []; app.req.code = app.req.code || 'HR-2610-0018'; if (!app.orders['HR-2610-0018']) app.orders['HR-2610-0018'] = {st:'PENDING',label:'Chờ duyệt',horses:[...app.req.horses],from:app.req.from,to:app.req.to,date:app.req.date,km:42,step:1}; app.screen = code; return; }
  app.stack = []; app.screen = code;
}
document.getElementById('btnReset').addEventListener('click', () => { const st = app.st; app = fresh(); app.st = st; mode = 'proto'; render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
render();
})();
</script>

<script>
/* Vẽ lại mượt: mỗi lần bấm, prototype vẽ lại cả khung màn. Đoạn này giữ vị trí cuộn
   và không chạy lại hiệu ứng vào của sheet, toast, thông báo khi vẫn ở cùng một màn. */
(function(){
const main = document.getElementById('main');
const pos = {};
let prev = null;
const sheetKey = scr => { const sh = scr.querySelector('.overlay .sheet'); return sh ? (sh.querySelector('b,h2,h3')||{}).textContent || 'sheet' : ''; };
const keyOf = (scr, el) => scr.dataset.screen + '|' + sheetKey(scr) + '|' + (el.classList.contains('sheet') ? 's' : 'b');
document.addEventListener('scroll', e => {
  const el = e.target;
  if (!(el instanceof Element) || !(el.classList.contains('body') || el.classList.contains('sheet'))) return;
  const scr = el.closest('.proto .screen');
  if (scr) pos[keyOf(scr, el)] = el.scrollTop;
}, true);
function snap(scr){
  if (!scr) return null;
  const n = scr.querySelector('.notif');
  return {code: scr.dataset.screen, sheet: sheetKey(scr), undo: !!scr.querySelector('.undo'), notif: n ? n.textContent : null, notifHTML: n ? n.outerHTML : null};
}
prev = snap(main.querySelector('.proto .screen'));
new MutationObserver(() => {
  const scr = main.querySelector('.proto .screen');
  const cur = snap(scr);
  if (scr && prev && prev.code === cur.code) {
    const ov = scr.querySelector('.overlay');
    if (ov && prev.sheet && prev.sheet === cur.sheet) ov.classList.add('still');
    if (cur.undo && prev.undo) scr.querySelectorAll('.undo').forEach(u => u.classList.add('still'));
    const n = scr.querySelector('.notif');
    if (n && prev.notif === cur.notif) n.classList.add('still');
    scr.querySelectorAll('.body,.sheet').forEach(el => { const v = pos[keyOf(scr, el)]; if (v) el.scrollTop = v; });
  } else if (scr) {
    Object.keys(pos).forEach(k => { if (!k.startsWith(cur.code + '|')) delete pos[k]; });
  }
  if (scr && prev && prev.notifHTML && !cur.notif && prev.code === cur.code) {
    const t = document.createElement('div'); t.innerHTML = prev.notifHTML;
    const out = t.firstElementChild; out.classList.add('still');
    scr.appendChild(out);
    requestAnimationFrame(() => { out.classList.remove('still'); out.classList.add('out'); });
    out.addEventListener('animationend', () => out.remove());
    setTimeout(() => out.remove(), 600);
  }
  prev = cur;
}).observe(main, {childList: true});
})();
</script>
