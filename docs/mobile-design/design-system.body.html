<title>HorseRoute Design System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh trên dính (tên + chuyển sáng/tối + mục lục), nội dung một cột rộng tối đa 1120px;
   mỗi component một hàng, các trạng thái xếp cạnh nhau trong ô rộng như màn điện thoại 343pt. */
:root{--bg:#f6faf9;--surface:#ffffff;--surfaceMuted:#e7f1f1;--surfaceElevated:#ffffff;--surfaceBrand:#0b3b42;--surfaceBrandAlt:#14606a;--onBrand:#ffffff;--onBrandMuted:#b9d3d6;--textPrimary:#0d2a2e;--textSecondary:#546d71;--textDisabled:#94a8a9;--border:#d8e6e6;--borderInput:#738a8d;--borderStrong:#0b3b42;--accent:#f4b942;--accentPressed:#ce9025;--onAccent:#2b1a00;--accentText:#7b4e00;--accentSubtle:#fef9ec;--link:#14606a;--focusRing:#14606a;--tabActive:#0b3b42;--tabInactive:#546d71;--successFg:#166534;--successBg:#eaf6ee;--successSolid:#166534;--warningFg:#a24a05;--warningBg:#fdf1e4;--warningSolid:#b45309;--dangerFg:#b42318;--dangerBg:#fdeceb;--dangerSolid:#dc2626;--infoFg:#14606a;--infoBg:#f2f8f8;--infoSolid:#14606a;--neutralFg:#546d71;--neutralBg:#e7f0f0;--overlay:rgba(6,20,22,0.48);--shadow-sm:0 1px 2px rgba(11,59,66,.04),0 0 0 0 transparent;--shadow-md:0 4px 12px rgba(11,59,66,.06);--shadow-lg:0 12px 32px rgba(11,59,66,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#061416;--surface:#0c2326;--surfaceMuted:#08191b;--surfaceElevated:#133034;--surfaceBrand:#104d56;--surfaceBrandAlt:#14606a;--onBrand:#ffffff;--onBrandMuted:#b9d3d6;--textPrimary:#e8f4f4;--textSecondary:#96b4b7;--textDisabled:#55716f;--border:#1a3a3e;--borderInput:#56777a;--borderStrong:#96b4b7;--accent:#f4b942;--accentPressed:#f5c76d;--onAccent:#2b1a00;--accentText:#f5c76d;--accentSubtle:#2a2410;--link:#7cc7cf;--focusRing:#7cc7cf;--tabActive:#e8f4f4;--tabInactive:#96b4b7;--successFg:#6fd39a;--successBg:#0f2a1e;--successSolid:#17753f;--warningFg:#f3a35c;--warningBg:#2e1f0f;--warningSolid:#b45309;--dangerFg:#ff8a80;--dangerBg:#341514;--dangerSolid:#dc2626;--infoFg:#7cc7cf;--infoBg:#0f2e33;--infoSolid:#14606a;--neutralFg:#96b4b7;--neutralBg:#12302f;--overlay:rgba(0,0,0,0.6);--shadow-sm:none;--shadow-md:none;--shadow-lg:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#061416;--surface:#0c2326;--surfaceMuted:#08191b;--surfaceElevated:#133034;--surfaceBrand:#104d56;--surfaceBrandAlt:#14606a;--onBrand:#ffffff;--onBrandMuted:#b9d3d6;--textPrimary:#e8f4f4;--textSecondary:#96b4b7;--textDisabled:#55716f;--border:#1a3a3e;--borderInput:#56777a;--borderStrong:#96b4b7;--accent:#f4b942;--accentPressed:#f5c76d;--onAccent:#2b1a00;--accentText:#f5c76d;--accentSubtle:#2a2410;--link:#7cc7cf;--focusRing:#7cc7cf;--tabActive:#e8f4f4;--tabInactive:#96b4b7;--successFg:#6fd39a;--successBg:#0f2a1e;--successSolid:#17753f;--warningFg:#f3a35c;--warningBg:#2e1f0f;--warningSolid:#b45309;--dangerFg:#ff8a80;--dangerBg:#341514;--dangerSolid:#dc2626;--infoFg:#7cc7cf;--infoBg:#0f2e33;--infoSolid:#14606a;--neutralFg:#96b4b7;--neutralBg:#12302f;--overlay:rgba(0,0,0,0.6);--shadow-sm:none;--shadow-md:none;--shadow-lg:none;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root{--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--textPrimary);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--borderInput);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.top .in{max-width:1120px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brandmark{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}
.brandmark .tile{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center}
.brandmark small{font-weight:500;color:var(--textSecondary);font-size:13px}
.seg{display:inline-flex;background:var(--surfaceMuted);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--textPrimary);padding:6px 12px;border-radius:9px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--surfaceBrand);color:var(--onBrand)}
.seg button:focus-visible,.toc a:focus-visible{outline:2px solid var(--focusRing);outline-offset:2px}
.toc{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;width:100%}
.toc a{color:var(--textSecondary);text-decoration:none;font-weight:500;padding:2px 0}
.toc a:hover{color:var(--link)}
@media (max-width:700px){.toc{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding-bottom:4px}.brandmark small{display:none}}
.spacer{flex:1}
main{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:56px}
h1{font-size:28px;line-height:36px;margin:0;letter-spacing:-.3px;text-wrap:balance}
h2{font-size:22px;line-height:30px;margin:0;letter-spacing:-.2px;text-wrap:balance}
h3{font-size:17px;line-height:24px;margin:0}
p{margin:0;max-width:68ch}
.lead{color:var(--textSecondary);font-size:16px}
.sec{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec-h{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--textSecondary)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--textSecondary)}
.note{font-size:13px;color:var(--textSecondary)}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
th{font-weight:600;color:var(--textSecondary);font-size:12px}
.pass{color:var(--successFg);font-weight:600}
.fail{color:var(--dangerFg);font-weight:600}
/* bảng màu */
.scale{display:flex;flex-direction:column;gap:6px}
.scale .row{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.sw{border-radius:8px;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-size:10.5px;font-family:var(--mono);line-height:1.2;border:1px solid rgba(127,127,127,.15)}
.sw.anchor{outline:2px solid var(--textPrimary);outline-offset:1px}
.scale .lbls{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;font-size:11px;color:var(--textSecondary);font-family:var(--mono)}
@media (max-width:700px){.scale .row,.scale .lbls{grid-template-columns:repeat(6,minmax(0,1fr))}.sw{height:44px}}
.chip-sw{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;border:1px solid rgba(127,127,127,.3)}
/* lưới demo */
.comp{display:flex;flex-direction:column;gap:12px;padding-block:20px;border-top:1px solid var(--border)}
.sec-h + .comp{border-top:0;padding-top:0}
.comp-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.comp-h .mono{color:var(--textSecondary)}
.comp-h p{flex-basis:100%;font-size:14px;color:var(--textSecondary)}
.states{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;padding-bottom:8px;min-width:0}
.cell{flex:none;width:343px;max-width:calc(100vw - 48px);display:flex;flex-direction:column;gap:8px}
.cell.wide{width:375px}
.cell.narrow{width:200px}
.cell .lab{font-size:12px;font-weight:600;color:var(--textSecondary)}
.stage{background:var(--bg);border:1px dashed var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:72px;justify-content:center;position:relative;overflow:hidden}
.stage.surface{background:var(--surface)}
.stage.flush{padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Component (đúng token, đúng kích thước pt) ================= */
.k{font-family:var(--font);color:var(--textPrimary)}
.ic{flex:none;display:block}
.t-largeTitle{font-size:34px;line-height:42px;font-weight:700;letter-spacing:-.4px}
.t-title1{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.3px}
.t-title2{font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.2px}
.t-title3{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.1px}
.t-display{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.2px}
.t-headline{font-size:17px;line-height:24px;font-weight:600}
.t-body{font-size:17px;line-height:26px}
.t-callout{font-size:16px;line-height:24px}
.t-subhead{font-size:15px;line-height:22px}
.t-footnote{font-size:13px;line-height:19px}
.t-caption{font-size:12px;line-height:18px;font-weight:500;letter-spacing:.1px}
.t2{color:var(--textSecondary)}
/* Button */
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font:600 17px/22px var(--font);border:1.5px solid transparent;height:48px;padding:0 20px;width:100%;cursor:pointer;transition:transform .15s,background .15s}
.k-btn.L{height:56px;font-size:18px;line-height:24px}
.k-btn.XL{height:64px;font-size:18px;line-height:24px;border-radius:16px}
.k-btn.S{height:36px;font-size:15px;line-height:20px;padding:0 14px;width:auto;border-radius:8px}
.k-btn.hug{width:auto}
.k-btn.primary{background:var(--accent);color:var(--onAccent)}
.k-btn.primary.is-pressed{background:var(--accentPressed);transform:scale(.98)}
.k-btn.secondary{background:var(--surface);color:var(--textPrimary);border-color:var(--borderStrong)}
.k-btn.secondary.is-pressed{background:var(--surfaceMuted);transform:scale(.98)}
.k-btn.tertiary{background:transparent;color:var(--link);text-decoration:underline;text-underline-offset:3px}
.k-btn.tertiary.is-pressed{background:var(--surfaceMuted)}
.k-btn.destructive{background:var(--dangerSolid);color:#fff}
.k-btn.destructive.is-pressed{filter:brightness(.9);transform:scale(.98)}
.k-btn.danger-outline{background:var(--surface);color:var(--dangerFg);border-color:var(--dangerFg)}
.k-btn[disabled]{background:var(--surfaceMuted);color:var(--textDisabled);border-color:transparent;cursor:not-allowed;text-decoration:none}
.k-btn.is-focus{outline:2px solid var(--focusRing);outline-offset:2px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.k-iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;border:0;background:transparent;color:var(--textPrimary);cursor:pointer;position:relative}
.k-iconbtn.filled{background:var(--surfaceMuted)}
.k-iconbtn.is-pressed{background:var(--border)}
.k-iconbtn[disabled]{color:var(--textDisabled)}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:9px;background:var(--accent);border:2px solid var(--surface)}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
/* Field */
.k-field{display:flex;flex-direction:column;gap:6px}
.k-box{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--borderInput)}
.k-box .in{flex:1;display:flex;flex-direction:column;min-width:0}
.k-box .fl{font-size:12px;line-height:16px;color:var(--textSecondary);font-weight:500}
.k-box .v{font-size:17px;line-height:24px;color:var(--textPrimary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-box .ph{font-size:17px;line-height:24px;color:var(--textSecondary)}
.k-box .ic{color:var(--textSecondary)}
.k-box.focus{border-color:var(--focusRing);box-shadow:0 0 0 3px color-mix(in srgb,var(--focusRing) 22%,transparent)}
.k-box.error{border-color:var(--dangerFg)}
.k-box.disabled{background:var(--surfaceMuted);border-color:transparent}
.k-box.disabled .v{color:var(--textDisabled)}
.caret{display:inline-block;width:2px;height:20px;background:var(--focusRing);vertical-align:middle;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.help{font-size:13px;line-height:19px;color:var(--textSecondary);display:flex;gap:6px;align-items:flex-start}
.help.err{color:var(--dangerFg)}
.k-area{min-height:120px;align-items:flex-start;padding:12px 14px}
.k-area .v{white-space:normal}
.count{font-size:12px;color:var(--textSecondary);text-align:right;font-variant-numeric:tabular-nums}
.k-label{font-size:15px;font-weight:600}
/* options list */
.k-options{background:var(--surfaceElevated);border-radius:16px;border:1px solid var(--border);overflow:hidden}
.k-opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--border);font-size:17px}
.k-opt:last-child{border-bottom:0}
.k-opt.sel{font-weight:600}
.k-opt .ic.chk{margin-left:auto;color:var(--link)}
/* Chip */
.k-chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--borderInput);background:var(--surface);font:500 15px/20px var(--font);color:var(--textPrimary)}
.k-chip.L{height:56px;padding:0 18px;font-size:16px;border-radius:16px}
.k-chip.sel{background:var(--surfaceBrand);border-color:var(--surfaceBrand);color:var(--onBrand)}
.k-chip.pressed{background:var(--surfaceMuted)}
.k-chip.dis{background:var(--surfaceMuted);border-color:transparent;color:var(--textDisabled)}
.k-chip.filter{height:36px;padding:0 12px;font-size:14px}
.k-chip .n{font-variant-numeric:tabular-nums;opacity:.8}
/* Stepper */
.k-stepper{display:flex;align-items:center;border:1.5px solid var(--borderInput);border-radius:12px;background:var(--surface);height:56px;overflow:hidden}
.k-stepper button{width:64px;height:100%;border:0;background:transparent;color:var(--textPrimary);display:grid;place-items:center;cursor:pointer}
.k-stepper button[disabled]{color:var(--textDisabled)}
.k-stepper button.is-pressed{background:var(--surfaceMuted)}
.k-stepper .val{flex:1;text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;border-inline:1px solid var(--border);height:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.k-stepper .val small{font-size:15px;font-weight:500;color:var(--textSecondary)}
/* Checklist item */
.k-checkrow{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.k-checkrow .tx{flex:1;display:flex;flex-direction:column}
.k-checkrow .tx b{font-size:17px;line-height:24px;font-weight:600}
.k-checkrow .tx span{font-size:13px;line-height:19px;color:var(--textSecondary)}
.k-cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--borderInput);display:grid;place-items:center;flex:none;background:var(--surface);color:var(--onBrand)}
.k-cb.on{background:var(--surfaceBrand);border-color:var(--surfaceBrand)}
.k-cb.sm{width:22px;height:22px;border-radius:6px}
.k-checkrow.done{background:var(--surfaceMuted);border-color:transparent}
.k-checkrow.err{border-color:var(--dangerFg)}
.k-checkrow.dis .k-cb{background:var(--surfaceMuted);border-color:var(--border)}
.k-checkrow.dis b{color:var(--textDisabled)}
/* Switch */
.k-switch{width:51px;height:31px;border-radius:999px;background:var(--borderInput);position:relative;flex:none}
.k-switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .25s}
.k-switch.on{background:var(--surfaceBrandAlt)}
.k-switch.on::after{left:22px}
.k-switch.dis{opacity:.45}
.setrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;background:var(--surface);border-radius:16px;border:1px solid var(--border)}
.setrow .tx{flex:1;font-size:17px}
/* Card */
.k-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.k-card.brand{background:var(--surfaceBrand);border-color:var(--surfaceBrand);color:var(--onBrand)}
.k-card.brand .t2{color:var(--onBrandMuted)}
.k-card.grad{background:linear-gradient(150deg,#0b3b42 0%,#14606a 100%);border-color:transparent;color:#fff}
.k-card.grad .t2{color:#b9d3d6}
.k-card.press{background:var(--surfaceMuted)}
.k-card.sel{border:2px solid var(--borderStrong)}
.k-card.elev{box-shadow:var(--shadow-sm)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:22px}
.kv span:first-child{color:var(--textSecondary)}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hr{height:1px;background:var(--border)}
.k-card.brand .hr{background:rgba(255,255,255,.18)}
/* ListItem */
.k-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.k-li{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-bottom:1px solid var(--border)}
.k-li:last-child{border-bottom:0}
.k-li .lead{width:40px;height:40px;border-radius:12px;background:var(--surfaceMuted);display:grid;place-items:center;color:var(--textPrimary);flex:none}
.k-li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.k-li .tx b{font-size:16px;line-height:22px;font-weight:600}
.k-li .tx span{font-size:13px;line-height:19px;color:var(--textSecondary)}
.k-li .tr{color:var(--textSecondary);display:flex;align-items:center;gap:6px;font-size:15px}
.k-li.press{background:var(--surfaceMuted)}
.k-li.unread{background:var(--accentSubtle)}
.k-li .udot{width:9px;height:9px;border-radius:9px;background:var(--accent);flex:none}
.k-li.dis b,.k-li.dis span{color:var(--textDisabled)}
/* Badge */
.k-badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:999px;font:600 13px/18px var(--font);white-space:nowrap}
.k-badge.sm{height:22px;font-size:12px;padding:0 8px 0 6px;gap:4px}
.tone-neutral{color:var(--neutralFg);background:var(--neutralBg)}
.tone-info{color:var(--infoFg);background:var(--infoBg)}
.tone-brand{color:var(--onBrand);background:var(--surfaceBrand)}
.tone-success{color:var(--successFg);background:var(--successBg)}
.tone-warning{color:var(--warningFg);background:var(--warningBg)}
.tone-danger{color:var(--dangerFg);background:var(--dangerBg)}
.k-card.brand .k-badge.tone-brand,.k-card.grad .k-badge.tone-brand{background:rgba(255,255,255,.14)}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.sgroup{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sgroup h3{font-size:15px}
.sgroup .mono{color:var(--textSecondary);font-size:11px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.srow .mono{overflow:hidden;text-overflow:ellipsis}
/* Severity bars */
.sev{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.sev i{width:4px;border-radius:1px;background:currentColor;opacity:.25}
.sev i:nth-child(1){height:6px}.sev i:nth-child(2){height:10px}.sev i:nth-child(3){height:14px}
.sev i.on{opacity:1}
/* HorseCard */
.k-horse{display:flex;gap:12px;align-items:flex-start}
.k-horse .ph{width:56px;height:56px;border-radius:12px;background:var(--surfaceMuted);display:grid;place-items:center;color:var(--textSecondary);flex:none}

<script>
const I = (n, s = 20, extra = '') => `<svg class="ic ${extra}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
document.getElementById('logoTile').innerHTML = I('horse', 20);

/* ---------- Chuyển giao diện ---------- */
const root = document.documentElement;
function setTheme(t){
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  document.querySelectorAll('#segTheme button').forEach(b => b.classList.toggle('on', b.dataset.th === t));
  try { localStorage.setItem('hr-ds-theme', t); } catch (e) {}
}
let saved = 'auto'; try { saved = localStorage.getItem('hr-ds-theme') || 'auto'; } catch (e) {}
setTheme(saved);
document.getElementById('segTheme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.th); });

/* ---------- Khung trình bày ---------- */
const sec = (id, eyebrow, title, lead, body) => `<section class="sec" id="${id}"><div class="sec-h"><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}</div>${body}</section>`;
const comp = (name, code, desc, states, cls = '') => `<div class="comp"><div class="comp-h"><h3>${name}</h3><span class="mono">${code}</span><p>${desc}</p></div><div class="states">${states.map(([l, h, c]) => `<div class="cell ${c || cls}"><span class="lab">${l}</span>${h}</div>`).join('')}</div></div>`;
const st = (h, cls = '') => `<div class="stage ${cls}">${h}</div>`;
const badge = (spec, sm) => `<span class="k-badge tone-${spec.tone}${sm ? ' sm' : ''}">${I(spec.icon, sm ? 14 : 16)}${spec.label}</span>`;
const S = DATA.status;

/* ---------- 1. Màu ---------- */
const anchors = {teal:['100','700','900','950'], gold:['500','700','950'], neutral:['50','200','600','900','950']};
const scaleNames = {teal:'Teal (brand)', gold:'Vàng (accent)', neutral:'Xám ngả teal (neutral)'};
const scaleNote = {teal:'Neo: 100 = --soft, 700 = --navy2, 900 = --navy, 950 = nền tối của web.', gold:'Neo: 500 = --gold (nút chính), 700 = --gold-d, 950 = chữ trên nút.', neutral:'Neo: 50 = --bg, 200 = --line, 600 = --muted, 900 = --ink.'};
function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function cr(a,b){const x=lum(a),y=lum(b);return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05))}
const palette = Object.entries(DATA.palette).map(([n, sc]) => `<div class="scale"><div class="row" style="justify-content:space-between"><h3 style="grid-column:1/-1">${scaleNames[n]}</h3></div><div class="row">${Object.entries(sc).map(([k, v]) => { const fg = cr(v,'#ffffff') >= cr(v,'#0d2a2e') ? '#ffffff' : '#0d2a2e'; return `<div class="sw ${anchors[n].includes(k)?'anchor':''}" style="background:${v};color:${fg}" title="${n}.${k} ${v}">${v}</div>`; }).join('')}</div><div class="lbls">${Object.keys(sc).map(k => `<span>${k}</span>`).join('')}</div><p class="note">${scaleNote[n]} Ô có viền đậm là màu lấy nguyên từ web; các bậc còn lại nội suy trong OKLCH.</p></div>`).join('');
