<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HorseRoute Khách hàng Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh công cụ dính trên cùng; chế độ Bấm thử = khung điện thoại + ghi chú; chế độ Xem tất cả = mỗi màn một hàng biến thể. */
:root{
  --page-bg:#eef3f2; --page-fg:#0d2a2e; --page-muted:#546d71; --page-line:#d3e1e1; --page-card:#ffffff; --page-brand:#0b3b42; --page-on-brand:#ffffff; --page-seg:#e1ebea;
  /* Bên trong khung: màu thương hiệu xanh #0b3b42, vàng #f4b942, trắng (00-context mục 5b); giữ một kiểu ở cả hai chế độ sáng/tối */
  --w-ink:#0b3b42; --w-ink2:#546d71; --w-ink3:#8aa3a6; --w-line:#d8e6e6; --w-fill:#e7f1f1; --w-fill2:#f6faf9; --w-bg:#ffffff; --w-dark:#0b3b42; --w-brand2:#14606a; --w-on-dark:#ffffff; --w-on-dark2:#b9d3d6; --w-shade:rgba(6,20,22,.5);
  --acc:#f4b942; --on-acc:#2b1a00;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}
html,body{background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page-card)}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #2f7c87;outline-offset:2px}

/* ---------- Thanh công cụ (ngoài khung) ---------- */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page-card);border-bottom:1px solid var(--page-line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.tb h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tb h1 small{font-weight:500;color:var(--page-muted);font-size:13px}
.tb .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb .lab{font-size:12px;color:var(--page-muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--page-seg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--page-fg);font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--page-brand);color:var(--page-on-brand)}
.tbtn{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:10px;padding:6px 12px;font-size:13px;min-height:38px;cursor:pointer}
.spacer{flex:1}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* ---------- Chế độ Bấm thử ---------- */
.proto{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.device{background:#0c2326;border-radius:52px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.device .screen{border-radius:40px}
.device.android{border-radius:28px;padding:10px}
.device.android .screen{border-radius:18px}
.fit{position:relative;flex:none}
.fit>.scaled{transform-origin:0 0;position:absolute;left:0;top:0}
.panel{flex:1 1 320px;max-width:440px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:18px;text-wrap:balance}
.pcard h3{margin:0;font-size:13px;font-weight:600;color:var(--page-muted);letter-spacing:.04em;text-transform:uppercase}
.pcard p,.pcard li{margin:0;font-size:14px;line-height:1.55}
.pcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--page-muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.jump button.on{border-color:var(--page-brand);background:var(--page-seg);font-weight:600}
.jump button .code{color:var(--page-muted);margin-right:6px}
.hint{font-size:13px;color:var(--page-muted)}

/* ---------- Chế độ Xem tất cả ---------- */
.grid{display:flex;flex-direction:column;gap:40px}
.grow-row{display:flex;flex-direction:column;gap:12px}
.grow-row>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.grow-row>header h2{margin:0;font-size:20px}
.grow-row>header p{margin:0;color:var(--page-muted);font-size:14px;max-width:70ch}
.strip{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.vcell{display:flex;flex-direction:column;gap:8px;flex:none}
.vcell .vl{font-size:13px;font-weight:600;max-width:390px}
.vcell .fit{border:1px solid var(--page-line);border-radius:6px;overflow:hidden;cursor:zoom-in}

/* ---------- Khung màn (wireframe) ---------- */
.screen{width:var(--fw);height:var(--fh);display:flex;flex-direction:column;background:var(--w-bg);color:var(--w-ink);font-family:var(--font);font-size:15px;line-height:1.4;position:relative;overflow:hidden;text-align:left}
.screen *{box-sizing:border-box}
.sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:600;font-size:15px;background:var(--w-bg)}
.android .sb{height:28px;padding:0 16px;font-size:13px}
.sbi{display:flex;align-items:center;gap:6px}
.sbi .bat{width:24px;height:12px;border:1.5px solid var(--w-ink);border-radius:3px;display:flex;padding:1.5px}
.sbi .bat span{width:70%;background:var(--w-ink);border-radius:1px}
.sbi .sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sbi .sig span{width:3px;background:var(--w-ink);border-radius:1px}
.hi{height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--w-bg)}
.hi span{width:134px;height:5px;border-radius:3px;background:var(--w-ink)}
.android .hi{height:24px} .android .hi span{width:108px;height:4px}
.hdr{min-height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--w-line);background:var(--w-bg)}
.hdr .t{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 4px}
.hdr .t b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{font-size:13px;color:var(--w-ink2)}
.hdr.big{min-height:64px;padding:0 16px;border-bottom:0}
.hdr.big .t b{font-size:26px;font-weight:700}
.ib{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--w-fill2)}
.body.white{background:var(--w-bg)}
.bottom{flex:none;display:flex;flex-direction:column;background:var(--w-bg);border-top:1px solid var(--w-line)}
.bottom .row{display:flex;gap:8px;padding:12px 16px 4px}
.bottom .note{padding:10px 16px 0;font-size:13px;color:var(--w-ink2)}
.btn{min-height:56px;border-radius:14px;font-family:var(--font);font-weight:600;font-size:16px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1.5px solid var(--w-ink);background:var(--w-bg);color:var(--w-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.xl{min-height:64px;font-size:17px}
.btn.grow{flex:1;min-width:0}
.btn.side{width:116px;flex:none;flex-direction:column;gap:2px;font-size:13px;padding:0 8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{background:var(--w-fill);color:var(--w-ink3);border-color:var(--w-line);cursor:default}
.card{background:var(--w-bg);border:1px solid var(--w-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tap{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--w-line);font-size:13px;font-weight:500;background:var(--w-bg);white-space:nowrap}
.chip.dark{background:var(--w-dark);color:#fff;border-color:var(--w-dark)}
.chip.fill{background:var(--w-fill)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--w-ink2)}
.muted{color:var(--w-ink2)} .small{font-size:13px}
.big{font-size:24px;font-weight:700;line-height:1.2;text-wrap:balance}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--w-line);background:var(--w-bg);font-family:var(--font);font-weight:500;font-size:15px;color:var(--w-ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opt.on{border-color:var(--w-ink);background:var(--w-fill);font-weight:600}
.bigopt{min-height:72px;width:100%;border-radius:16px;border:1.5px solid var(--w-line);background:var(--w-bg);display:flex;align-items:center;gap:12px;padding:12px 16px;font-family:var(--font);color:var(--w-ink);text-align:left;cursor:pointer}
.bigopt.on{border:2.5px solid var(--w-ink);background:var(--w-fill)}
.bigopt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bigopt .tx b{font-size:17px}
.bigopt .tx span{font-size:13px;color:var(--w-ink2)}
.ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--w-fill);display:flex;align-items:center;justify-content:center}
.sevm{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none}
.sevm span{width:6px;border-radius:2px;background:var(--w-line)}
.sevm span.f{background:var(--w-ink)}
.tabbar{flex:none;display:flex;border-top:1px solid var(--w-line);background:var(--w-bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:11px;color:var(--w-ink3);background:none;border:0;cursor:pointer;font-family:var(--font);min-height:56px}
.tab.on{color:var(--w-ink);font-weight:600}
.overlay{position:absolute;inset:0;background:var(--w-shade);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.overlay.center{justify-content:center;padding:24px}
.sheet{background:var(--w-bg);border-radius:20px 20px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--w-line);align-self:center}
.dialog{background:var(--w-bg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3,.dialog h3{margin:0;font-size:20px;font-weight:700}
.kvw{display:flex;flex-direction:column;border:1px solid var(--w-line);border-radius:14px}
.kvw>div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--w-line);align-items:center}
.kvw>div:first-child{border-top:0}
.kvw span:first-child{color:var(--w-ink2);font-size:14px}
.kvw b{font-weight:600;text-align:right}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;text-decoration:underline;color:var(--w-ink);cursor:pointer;min-height:44px}
.box{border:1.5px dashed var(--w-ink3);border-radius:12px;padding:12px;display:flex;gap:10px;font-size:14px;align-items:flex-start}
.box.err{border:2px solid var(--w-ink);border-style:solid}
.skel{background:var(--w-fill);border-radius:8px}
.hatch{background-color:var(--w-fill2);background-image:repeating-linear-gradient(45deg,#cfe0e0 0 1.5px,transparent 1.5px 10px);border:1px solid var(--w-line);border-radius:12px}
.bar{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;min-height:44px;background:var(--w-brand2);color:#fff;font-size:13px;font-weight:500;flex:none;border:0;width:100%;font-family:var(--font);text-align:left;cursor:pointer}
.bar .grow{flex:1;min-width:0}
.bar.light{background:var(--w-fill);color:var(--w-ink)}
.card.brand{background:var(--w-dark);border-color:var(--w-dark);color:var(--w-on-dark)}
.card.brand .lbl,.card.brand .muted{color:var(--w-on-dark2)}
.card.brand .chip{background:transparent;color:var(--w-on-dark);border-color:rgba(255,255,255,.35)}
.card.brand .chip.dark{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.card.brand .link{color:var(--w-on-dark)}
.undo{margin:12px 12px 0;background:var(--w-dark);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;min-height:60px}
.undo .grow{flex:1;min-width:0;font-size:14px}
.undo button{min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid #fff;background:transparent;color:#fff;font-family:var(--font);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tl{display:flex;flex-direction:column}
.stop{display:flex;gap:12px}
.rail{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--w-ink3);background:var(--w-bg);margin-top:3px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.dot.done{background:var(--w-ink);border-color:var(--w-ink)}
.dot.cur{border:5px solid var(--w-ink)}
.ln{flex:1;width:2px;background:var(--w-line);min-height:20px}
.ln.done{background:var(--w-ink)}
.stop .info{flex:1;min-width:0;padding-bottom:16px;display:flex;flex-direction:column;gap:2px}
.stop .info b{font-size:15px}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.listrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--w-line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:var(--font);font-size:15px;color:var(--w-ink);text-align:left;cursor:pointer}
.listrow:first-child{border-top:0}
.listrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--w-ink);flex:none;display:flex;align-items:center;justify-content:center;background:var(--w-bg)}
.chk.on{background:var(--w-ink);color:#fff}
.field{border:1.5px solid var(--w-line);border-radius:12px;min-height:96px;padding:12px;font-size:15px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--w-bg)}
.field.err{border-color:var(--w-ink);border-width:2px}
.ph{color:var(--w-ink3)}
.photos{display:flex;gap:8px}
.photo{width:96px;height:96px;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;color:var(--w-ink2)}
.addph{width:96px;height:96px;flex:none;border:1.5px dashed var(--w-ink3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;background:var(--w-bg);color:var(--w-ink);cursor:pointer;font-family:var(--font)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.circle{width:72px;height:72px;border-radius:50%;border:2px solid var(--w-ink);display:flex;align-items:center;justify-content:center}
.circle.fill{background:var(--w-ink);color:#fff}
.stubtag{font-size:12px;border:1px dashed var(--w-ink3);border-radius:8px;padding:6px 10px;color:var(--w-ink2)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.lbl em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--w-ink3)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .ib{border:1.5px solid var(--w-ink);width:64px;height:48px;font-size:18px;font-weight:600;font-family:var(--font)}
.stepper b{flex:1;text-align:center;font-size:22px}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:760px){.tb{position:static;gap:6px 10px;padding-block:8px}.tb .lab{display:none}.seg button{padding:5px 8px;font-size:12.5px;min-height:30px}.tb h1 small{display:none}}

/* Thanh cuộn kiểu điện thoại: một vạch mảnh, mờ, không khung, không mũi tên */
.screen *{scrollbar-width:thin;scrollbar-color:rgba(11,59,66,.28) transparent}
.screen ::-webkit-scrollbar{width:4px;height:4px;background:transparent}
.screen ::-webkit-scrollbar-track{background:transparent}
.screen ::-webkit-scrollbar-thumb{background:rgba(11,59,66,.28);border-radius:4px}
.screen ::-webkit-scrollbar-button{display:none;width:0;height:0}
.screen ::-webkit-scrollbar-corner{background:transparent}
html,.strip{scrollbar-width:thin;scrollbar-color:rgba(84,109,113,.45) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(84,109,113,.45);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-button{display:none;width:0;height:0}
</style>
</head>
<body>

<style>
.card.grad{background:linear-gradient(135deg,#0b3b42 0%,#14606a 100%);border:0;color:#fff}
.card.grad .lbl,.card.grad .muted{color:var(--w-on-dark2)}
.card.grad .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.card.grad .chip.gold{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.chip.gold{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.chip.line{border:1.5px solid var(--w-ink);color:var(--w-ink);font-weight:600}
.dots{display:flex;align-items:center;gap:0}
.dots .d{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.6);flex:none}
.dots .d.on{background:#fff;border-color:#fff}
.dots .d.cur{background:var(--acc);border-color:var(--acc);width:14px;height:14px}
.dots .l{flex:1;height:2px;background:rgba(255,255,255,.35)}
.dots .l.on{background:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--w-bg);border-bottom:1px solid var(--w-line);flex:none}
.filters .opt{min-height:40px;white-space:nowrap}
.prog{display:flex;gap:4px;padding:12px 16px 0;background:var(--w-bg);flex:none}
.prog span{flex:1;height:4px;border-radius:2px;background:var(--w-line)}
.prog span.on{background:var(--w-ink)}
.steps{display:flex;flex-direction:column;gap:0}
.steps .s{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px;color:var(--w-ink2)}
.steps .s .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--w-line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--w-bg)}
.steps .s.done{color:var(--w-ink)} .steps .s.done .n{background:var(--w-ink);border-color:var(--w-ink);color:#fff}

/* ---------- Vẽ trang ---------- */
const main = document.getElementById('main');
function render(){
  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('#segPlat button').forEach(b => b.classList.toggle('on', b.dataset.plat === plat));
  document.querySelectorAll('#segState button').forEach(b => b.classList.toggle('on', b.dataset.st === app.st));
  document.getElementById('grpScale').hidden = mode !== 'grid';
  document.querySelector('#segState').closest('.grp').hidden = mode === 'grid';
  if (mode === 'grid') return renderGrid();
  const code = app.screen, n = NOTES[code], stub = STUBS[code];
  const s = protoScale(), d = DIM[plat], pad = plat==='ios'?12:10;
  const dev = `<div class="device ${plat}">${screenHTML(code, app)}</div>`;
  const devFit = s < 1 ? `<div class="fit" style="width:${Math.round((d.w+pad*2)*s)}px;height:${Math.round((d.h+pad*2)*s)}px"><div class="scaled" style="transform:scale(${s})">${dev}</div></div>` : dev;
  const info = n ? `<div class="pcard"><h3>${code} · ${n.kind}</h3><h2>${n.n}</h2><p>${n.p}</p><dl class="kv"><dt>Hành động chính</dt><dd>${n.a}</dd><dt>Dữ liệu</dt><dd>${n.d}</dd><dt>API</dt><dd class="code">${n.api}</dd></dl><ul>${n.b.map(x => `<li>${x}</li>`).join('')}</ul></div>`
    : `<div class="pcard"><h3>${code==='MAP'?'CUS-05':code}</h3><h2>${stub[0]}</h2><p>${stub[1]}.</p></div>`;
  const list = ['CUS-01','CUS-05','CUS-06','CUS-02','CUS-03','CUS-04','CUS-08','CUS-09','CUS-10','CUS-11','CUS-12','CUS-13','CUS-14','CUS-15'];
  const orderPick = code === 'CUS-03' ? `<div class="pcard"><h3>Xem đơn ở trạng thái khác</h3><div class="jump">${Object.entries(app.orders).map(([k,o]) => `<button data-order="${k}" class="${app.order===k?'on':''}"><span class="code">${k}</span>${o.label}</button>`).join('')}</div></div>` : '';
  const jump = `<div class="pcard"><h3>Màn đã vẽ (P0)</h3><div class="jump">${list.map(k => `<button data-jump="${k}" class="${app.screen===k?'on':''}"><span class="code">${k}</span>${NOTES[k].n}</button>`).join('')}</div><p class="hint">Bấm vào nút trong khung để đi theo luồng. Thanh Trạng thái phía trên đổi màn hiện tại sang Đang tải, Trống, Lỗi hoặc Mất sóng.</p></div>`;
  main.innerHTML = `<div class="proto"><div>${devFit}</div><div class="panel">${info}${orderPick}${jump}</div></div>`;
}
function renderGrid(){
  const s = gridScale || (document.documentElement.clientWidth >= 1100 ? 1 : 0.5);
  document.querySelectorAll('#segScale button').forEach(b => b.classList.toggle('on', +b.dataset.sc === s));
  main.innerHTML = `<div class="grid">${GRID.map(([code, vs]) => { const n = NOTES[code];
    return `<section class="grow-row"><header><h2>${code} · ${n.n}</h2><p>${n.p} Hành động chính: ${n.a}.</p></header><div class="strip">${vs.map((v,k) => {
      const c = {...fresh(), ...v, st:v.st||'normal'};
      return `<div class="vcell"><span class="vl">${v.l}</span><div data-open="${code}">${fit(screenHTML(code, c, k ? `${code}--${k}` : code), s)}</div></div>`;
    }).join('')}</div></section>`; }).join('')}</div>`;
}

/* ---------- Hành động ---------- */
function go(code){ app.stack.push(app.screen); app.screen = code; app.sheet = null; }
function say(msg){ app.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { app.toast = null; render(); }, 3000); }
const ACT = {
  noop(){},
  go(a){ go(a); },
  back(){ app.sheet = null; app.screen = app.stack.pop() || 'CUS-01'; },
  tab(a){ app.stack = []; app.screen = a; app.sheet = null; },
  sheet(a){ app.sheet = a; },
  close(){ app.sheet = null; },
  filter(a){ app.filter = a; },
  track(){ app.order = 'HR-2610-0012'; go('CUS-05'); },
  openOrder(a){ app.order = a; go('CUS-03'); },
  openQuote(a){ app.order = a; go('CUS-04'); },
  report(a){ app.horse = a; go('CUS-06'); },
  payDone(){ const o = app.orders[app.order]; o.quote = {...o.quote, paid:o.quote.deposit, expires:null, receipts:[['Đặt cọc · Chuyển khoản QR','29/10/2026',o.quote.deposit]]}; o.st = 'PREPARING'; o.label = 'Đang chuẩn bị'; o.step = 3; app.sheet = null; say('Đã nhận tiền cọc. Đơn chuyển sang Đang chuẩn bị.'); },
  openHorse(a){ app.horse = a; go('CUS-09'); },
  addHorse(){ app.editing = false; go('CUS-10'); },
  editHorse(){ app.editing = true; go('CUS-10'); },
  saveHorse(){
    if (app.st === 'error') return;
    if (!app.editing && !app.horses.some(h => h.name === 'Phong Vũ')) app.horses.push({name:'Phong Vũ',breed:'Arabian',sex:'Đực',color:'Xám bạc',born:'2021',passport:'VN-AR-0331',chip:'',kg:440,cm:150,feed:'Cỏ khô 7 kg, yến mạch 1 kg',docs:[]});
    const name = app.editing ? app.horse : 'Phong Vũ'; ACT.back(); say(`Đã lưu hồ sơ ${name}`);
  },
  startReq(){ app.req = newReq(); go('CUS-11'); },
  reqHorse(a){ app.req = {...newReq(), horses:[a]}; go('CUS-11'); },
  reqToggle(a){ const r = app.req; r.horses = r.horses.includes(a) ? r.horses.filter(x => x !== a) : [...r.horses, a]; },
  reqNote(a){ app.req.note = NOTE_TIPS[+a]; },
  toStep(a){ while (app.stack.length && app.screen !== a) app.screen = app.stack.pop(); },
  resubmit(){ app.req = {...newReq(), horses:['Hồng Vân'], to:'Sân bay Tân Sơn Nhất (khu hàng hóa)', date:'25/11/2026'}; go('CUS-12'); },
  leaveReq(){ const code = 'HR-2610-0017'; app.orders[code] = {st:'DRAFT',label:'Nháp',horses:[...app.req.horses],from:app.req.from,to:app.req.to,date:app.req.date,km:42,step:0}; app.stack = []; app.screen = 'CUS-02'; app.filter = 'proc'; app.sheet = null; },
  submitReq(){
    if (app.st === 'error') return;
    const code = 'HR-2610-0018'; const r = app.req; r.code = code;
    app.orders[code] = {st:'PENDING',label:'Chờ duyệt',horses:[...r.horses],from:r.from,to:r.to,date:r.date,km:42,step:1};
    app.stack = []; app.screen = 'CUS-15';
  }
};

document.addEventListener('click', e => {
  const seg = e.target.closest('[data-mode],[data-plat],[data-st],[data-sc],[data-jump],[data-open],[data-order]');
  if (seg) {
    const d = seg.dataset;
    if (d.mode) mode = d.mode;
    else if (d.plat) plat = d.plat;
    else if (d.st) app.st = d.st;
    else if (d.sc) gridScale = +d.sc;
    else if (d.order) app.order = d.order;
    else if (d.jump) jumpTo(d.jump);
    else if (d.open) { mode = 'proto'; jumpTo(d.open); window.scrollTo(0,0); }
    render(); return;
  }
  if (mode !== 'proto') return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !main.contains(t)) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg); render(); }
});
function jumpTo(code){
  app.sheet = null;
  const tabs = {'CUS-01':[], 'CUS-02':[], 'CUS-08':[]};
  if (code in tabs) { app.stack = []; app.screen = code; return; }
  if (code === 'CUS-05') { app.stack = ['CUS-01']; app.screen = code; return; }
  if (code === 'CUS-06') { app.stack = ['CUS-01','CUS-05']; app.horse = 'Kim Long'; app.screen = code; return; }
  if (code === 'CUS-03') { app.stack = ['CUS-02']; app.order = 'HR-2610-0009'; app.screen = code; return; }
  if (code === 'CUS-04') { app.stack = ['CUS-02','CUS-03']; app.order = 'HR-2610-0015'; app.screen = code; return; }
  if (code === 'CUS-09') { app.stack = ['CUS-08']; app.horse = 'Hồng Vân'; app.screen = code; return; }
  if (code === 'CUS-10') { app.stack = ['CUS-08']; app.editing = false; app.screen = code; return; }
  const wiz = ['CUS-11','CUS-12','CUS-13','CUS-14'];
  if (wiz.includes(code)) { app.stack = ['CUS-02'].concat(wiz.slice(0, wiz.indexOf(code))); if (code !== 'CUS-11' && app.req.horses.length < 2) app.req = {...REQ_FULL}; app.screen = code; return; }
  if (code === 'CUS-15') { app.stack = []; app.req.code = app.req.code || 'HR-2610-0018'; if (!app.orders['HR-2610-0018']) app.orders['HR-2610-0018'] = {st:'PENDING',label:'Chờ duyệt',horses:[...app.req.horses],from:app.req.from,to:app.req.to,date:app.req.date,km:42,step:1}; app.screen = code; return; }
  app.stack = []; app.screen = code;
}
document.getElementById('btnReset').addEventListener('click', () => { const st = app.st; app = fresh(); app.st = st; mode = 'proto'; render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
render();
})();
</script>
</body>
</html>
