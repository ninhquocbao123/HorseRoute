<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HorseRoute Tài xế Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh công cụ dính trên cùng; chế độ Bấm thử = khung điện thoại + ghi chú; chế độ Xem tất cả = mỗi màn một hàng biến thể. */
:root{
  --page-bg:#eef3f2; --page-fg:#0d2a2e; --page-muted:#546d71; --page-line:#d3e1e1; --page-card:#ffffff; --page-brand:#0b3b42; --page-on-brand:#ffffff; --page-seg:#e1ebea;
  /* Bên trong khung: màu thương hiệu xanh #0b3b42, vàng #f4b942, trắng (00-context mục 5b); giữ một kiểu ở cả hai chế độ sáng/tối */
  --w-ink:#0b3b42; --w-ink2:#546d71; --w-ink3:#8aa3a6; --w-line:#d8e6e6; --w-fill:#e7f1f1; --w-fill2:#f6faf9; --w-bg:#ffffff; --w-dark:#0b3b42; --w-brand2:#14606a; --w-on-dark:#ffffff; --w-on-dark2:#b9d3d6; --w-shade:rgba(6,20,22,.5);
  --acc:#f4b942; --on-acc:#2b1a00;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#061416;--page-fg:#e8f4f4;--page-muted:#96b4b7;--page-line:#1a3a3e;--page-card:#0c2326;--page-brand:#14606a;--page-on-brand:#ffffff;--page-seg:#0f2b2f;color-scheme:dark}
html,body{background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page-card)}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #2f7c87;outline-offset:2px}

/* ---------- Thanh công cụ (ngoài khung) ---------- */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page-card);border-bottom:1px solid var(--page-line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.tb h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tb h1 small{font-weight:500;color:var(--page-muted);font-size:13px}
.tb .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb .lab{font-size:12px;color:var(--page-muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--page-seg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--page-fg);font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--page-brand);color:var(--page-on-brand)}
.tbtn{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:10px;padding:6px 12px;font-size:13px;min-height:38px;cursor:pointer}
.spacer{flex:1}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* ---------- Chế độ Bấm thử ---------- */
.proto{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.device{background:#0c2326;border-radius:52px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.device .screen{border-radius:40px}
.device.android{border-radius:28px;padding:10px}
.device.android .screen{border-radius:18px}
.fit{position:relative;flex:none}
.fit>.scaled{transform-origin:0 0;position:absolute;left:0;top:0}
.panel{flex:1 1 320px;max-width:440px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:18px;text-wrap:balance}
.pcard h3{margin:0;font-size:13px;font-weight:600;color:var(--page-muted);letter-spacing:.04em;text-transform:uppercase}
.pcard p,.pcard li{margin:0;font-size:14px;line-height:1.55}
.pcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--page-muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:transparent;color:var(--page-fg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.jump button.on{border-color:var(--page-brand);background:var(--page-seg);font-weight:600}
.jump button .code{color:var(--page-muted);margin-right:6px}
.hint{font-size:13px;color:var(--page-muted)}

/* ---------- Chế độ Xem tất cả ---------- */
.grid{display:flex;flex-direction:column;gap:40px}
.grow-row{display:flex;flex-direction:column;gap:12px}
.grow-row>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.grow-row>header h2{margin:0;font-size:20px}
.grow-row>header p{margin:0;color:var(--page-muted);font-size:14px;max-width:70ch}
.strip{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.vcell{display:flex;flex-direction:column;gap:8px;flex:none}
.vcell .vl{font-size:13px;font-weight:600;max-width:390px}
.vcell .fit{border:1px solid var(--page-line);border-radius:6px;overflow:hidden;cursor:zoom-in}

/* ---------- Khung màn (wireframe) ---------- */
.screen{width:var(--fw);height:var(--fh);display:flex;flex-direction:column;background:var(--w-bg);color:var(--w-ink);font-family:var(--font);font-size:15px;line-height:1.4;position:relative;overflow:hidden;text-align:left}
.screen *{box-sizing:border-box}
.sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:600;font-size:15px;background:var(--w-bg)}
.android .sb{height:28px;padding:0 16px;font-size:13px}
.sbi{display:flex;align-items:center;gap:6px}
.sbi .bat{width:24px;height:12px;border:1.5px solid var(--w-ink);border-radius:3px;display:flex;padding:1.5px}
.sbi .bat span{width:70%;background:var(--w-ink);border-radius:1px}
.sbi .sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sbi .sig span{width:3px;background:var(--w-ink);border-radius:1px}
.hi{height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--w-bg)}
.hi span{width:134px;height:5px;border-radius:3px;background:var(--w-ink)}
.android .hi{height:24px} .android .hi span{width:108px;height:4px}
.hdr{min-height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--w-line);background:var(--w-bg)}
.hdr .t{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 4px}
.hdr .t b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{font-size:13px;color:var(--w-ink2)}
.hdr.big{min-height:64px;padding:0 16px;border-bottom:0}
.hdr.big .t b{font-size:26px;font-weight:700}
.ib{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--w-fill2)}
.body.white{background:var(--w-bg)}
.bottom{flex:none;display:flex;flex-direction:column;background:var(--w-bg);border-top:1px solid var(--w-line)}
.bottom .row{display:flex;gap:8px;padding:12px 16px 4px}
.bottom .note{padding:10px 16px 0;font-size:13px;color:var(--w-ink2)}
.btn{min-height:56px;border-radius:14px;font-family:var(--font);font-weight:600;font-size:16px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1.5px solid var(--w-ink);background:var(--w-bg);color:var(--w-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.xl{min-height:64px;font-size:17px}
.btn.grow{flex:1;min-width:0}
.btn.side{width:116px;flex:none;flex-direction:column;gap:2px;font-size:13px;padding:0 8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{background:var(--w-fill);color:var(--w-ink3);border-color:var(--w-line);cursor:default}
.card{background:var(--w-bg);border:1px solid var(--w-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tap{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--w-line);font-size:13px;font-weight:500;background:var(--w-bg);white-space:nowrap}
.chip.dark{background:var(--w-dark);color:#fff;border-color:var(--w-dark)}
.chip.fill{background:var(--w-fill)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--w-ink2)}
.muted{color:var(--w-ink2)} .small{font-size:13px}
.big{font-size:24px;font-weight:700;line-height:1.2;text-wrap:balance}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--w-line);background:var(--w-bg);font-family:var(--font);font-weight:500;font-size:15px;color:var(--w-ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opt.on{border-color:var(--w-ink);background:var(--w-fill);font-weight:600}
.bigopt{min-height:72px;width:100%;border-radius:16px;border:1.5px solid var(--w-line);background:var(--w-bg);display:flex;align-items:center;gap:12px;padding:12px 16px;font-family:var(--font);color:var(--w-ink);text-align:left;cursor:pointer}
.bigopt.on{border:2.5px solid var(--w-ink);background:var(--w-fill)}
.bigopt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bigopt .tx b{font-size:17px}
.bigopt .tx span{font-size:13px;color:var(--w-ink2)}
.ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--w-fill);display:flex;align-items:center;justify-content:center}
.sevm{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none}
.sevm span{width:6px;border-radius:2px;background:var(--w-line)}
.sevm span.f{background:var(--w-ink)}
.tabbar{flex:none;display:flex;border-top:1px solid var(--w-line);background:var(--w-bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:11px;color:var(--w-ink3);background:none;border:0;cursor:pointer;font-family:var(--font);min-height:56px}
.tab.on{color:var(--w-ink);font-weight:600}
.overlay{position:absolute;inset:0;background:var(--w-shade);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.overlay.center{justify-content:center;padding:24px}
.sheet{background:var(--w-bg);border-radius:20px 20px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--w-line);align-self:center}
.dialog{background:var(--w-bg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3,.dialog h3{margin:0;font-size:20px;font-weight:700}
.kvw{display:flex;flex-direction:column;border:1px solid var(--w-line);border-radius:14px}
.kvw>div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--w-line);align-items:center}
.kvw>div:first-child{border-top:0}
.kvw span:first-child{color:var(--w-ink2);font-size:14px}
.kvw b{font-weight:600;text-align:right}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;text-decoration:underline;color:var(--w-ink);cursor:pointer;min-height:44px}
.box{border:1.5px dashed var(--w-ink3);border-radius:12px;padding:12px;display:flex;gap:10px;font-size:14px;align-items:flex-start}
.box.err{border:2px solid var(--w-ink);border-style:solid}
.skel{background:var(--w-fill);border-radius:8px}
.hatch{background-color:var(--w-fill2);background-image:repeating-linear-gradient(45deg,#cfe0e0 0 1.5px,transparent 1.5px 10px);border:1px solid var(--w-line);border-radius:12px}
.bar{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;min-height:44px;background:var(--w-brand2);color:#fff;font-size:13px;font-weight:500;flex:none;border:0;width:100%;font-family:var(--font);text-align:left;cursor:pointer}
.bar .grow{flex:1;min-width:0}
.bar.light{background:var(--w-fill);color:var(--w-ink)}
.card.brand{background:var(--w-dark);border-color:var(--w-dark);color:var(--w-on-dark)}
.card.brand .lbl,.card.brand .muted{color:var(--w-on-dark2)}
.card.brand .chip{background:transparent;color:var(--w-on-dark);border-color:rgba(255,255,255,.35)}
.card.brand .chip.dark{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.card.brand .link{color:var(--w-on-dark)}
.undo{margin:12px 12px 0;background:var(--w-dark);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;min-height:60px}
.undo .grow{flex:1;min-width:0;font-size:14px}
.undo button{min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid #fff;background:transparent;color:#fff;font-family:var(--font);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tl{display:flex;flex-direction:column}
.stop{display:flex;gap:12px}
.rail{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--w-ink3);background:var(--w-bg);margin-top:3px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.dot.done{background:var(--w-ink);border-color:var(--w-ink)}
.dot.cur{border:5px solid var(--w-ink)}
.ln{flex:1;width:2px;background:var(--w-line);min-height:20px}
.ln.done{background:var(--w-ink)}
.stop .info{flex:1;min-width:0;padding-bottom:16px;display:flex;flex-direction:column;gap:2px}
.stop .info b{font-size:15px}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.listrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--w-line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:var(--font);font-size:15px;color:var(--w-ink);text-align:left;cursor:pointer}
.listrow:first-child{border-top:0}
.listrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--w-ink);flex:none;display:flex;align-items:center;justify-content:center;background:var(--w-bg)}
.chk.on{background:var(--w-ink);color:#fff}
.field{border:1.5px solid var(--w-line);border-radius:12px;min-height:96px;padding:12px;font-size:15px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--w-bg)}
.field.err{border-color:var(--w-ink);border-width:2px}
.ph{color:var(--w-ink3)}
.photos{display:flex;gap:8px}
.photo{width:96px;height:96px;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;color:var(--w-ink2)}
.addph{width:96px;height:96px;flex:none;border:1.5px dashed var(--w-ink3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;background:var(--w-bg);color:var(--w-ink);cursor:pointer;font-family:var(--font)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.circle{width:72px;height:72px;border-radius:50%;border:2px solid var(--w-ink);display:flex;align-items:center;justify-content:center}
.circle.fill{background:var(--w-ink);color:#fff}
.stubtag{font-size:12px;border:1px dashed var(--w-ink3);border-radius:8px;padding:6px 10px;color:var(--w-ink2)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.lbl em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--w-ink3)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .ib{border:1.5px solid var(--w-ink);width:64px;height:48px;font-size:18px;font-weight:600;font-family:var(--font)}
.stepper b{flex:1;text-align:center;font-size:22px}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:760px){.tb{position:static;gap:6px 10px;padding-block:8px}.tb .lab{display:none}.seg button{padding:5px 8px;font-size:12.5px;min-height:30px}.tb h1 small{display:none}}

/* Thanh cuộn kiểu điện thoại: một vạch mảnh, mờ, không khung, không mũi tên */
.screen *{scrollbar-width:thin;scrollbar-color:rgba(11,59,66,.28) transparent}
.screen ::-webkit-scrollbar{width:4px;height:4px;background:transparent}
.screen ::-webkit-scrollbar-track{background:transparent}
.screen ::-webkit-scrollbar-thumb{background:rgba(11,59,66,.28);border-radius:4px}
.screen ::-webkit-scrollbar-button{display:none;width:0;height:0}
.screen ::-webkit-scrollbar-corner{background:transparent}
html,.strip{scrollbar-width:thin;scrollbar-color:rgba(84,109,113,.45) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(84,109,113,.45);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-button{display:none;width:0;height:0}
</style>
</head>
<body>

<div class="tb" id="toolbar">
  <h1>HorseRoute · Tài xế <small>Wireframe bấm thử · đợt 1/4</small></h1>
  <div class="grp"><span class="lab">Chế độ</span><div class="seg" id="segMode"><button data-mode="proto" class="on">Bấm thử</button><button data-mode="grid">Xem tất cả màn</button></div></div>
  <div class="grp"><span class="lab">Trạng thái</span><div class="seg" id="segState"><button data-st="normal" class="on">Bình thường</button><button data-st="loading">Đang tải</button><button data-st="empty">Trống</button><button data-st="error">Lỗi</button><button data-st="offline">Mất sóng</button></div></div>
  <div class="grp"><span class="lab">Khung</span><div class="seg" id="segPlat"><button data-plat="ios" class="on">iPhone 390×844</button><button data-plat="android">Android 360×800</button></div></div>
  <div class="grp" id="grpScale" hidden><span class="lab">Tỉ lệ</span><div class="seg" id="segScale"><button data-sc="0.5">50%</button><button data-sc="1">100%</button></div></div>
  <span class="spacer"></span>
  <button class="tbtn" id="btnReset">Làm lại từ đầu</button>
</div>
<main id="main"></main>

<script>
(function(){
'use strict';
/* ---------- Biểu tượng (nét Lucide, 2px) ---------- */
const P = {
  back:'<path d="m15 18-6-6 6-6"/>',

  const head = `<div class="hdr big"><div class="t"><b>Chuyến của tôi</b><small>${c.st==='offline' ? 'Dữ liệu lưu lúc 05:34' : 'Cập nhật 05:34 · kéo xuống để làm mới'}</small></div></div>`;

  if (c.st === 'error') return head + `<div class="body white"><div class="empty"><div class="circle">${ic('alert',32)}</div><b style="font-size:18px">Không tải được danh sách chuyến</b><p class="muted small" style="margin:0;max-width:280px">Máy chủ không phản hồi. Kiểm tra kết nối rồi thử lại, hoặc gọi điều phối 1900 6868.</p><button class="btn pri" data-act="noop">${ic('refresh',20)} Thử lại</button></div></div>` + tabbar('DRV-01');

    <div class="lbl">Hôm nay</div>

      ${cur}
      <div class="row small muted" style="flex-wrap:wrap">${ic('clock',16)} Khởi hành 06:00 · 2 ngựa · 3 điểm dừng</div>
      <div class="row small muted">${ic('truck',16)} Bạn lái · 51C-482.17</div>
    </button>
    <div class="lbl">Sắp tới</div>
    <button class="card tap" data-act="openTrip" data-arg="b">
      <div class="row between"><b style="font-size:17px">HR-2611-0003</b><span class="chip">Đang chuẩn bị</span></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span>Trường đua Phú Thọ, Q.11</span><span class="muted">đến Sân bay Tân Sơn Nhất (khu hàng hóa)</span></div>
      <div class="row small muted">${ic('clock',16)} 12/11 · 05:30 · 1 ngựa</div>
    </button>
    <button class="listrow" data-act="go" data-arg="DRV-11" style="background:transparent">${ic('list',22)}<span class="grow">Chuyến đã xong</span>${ic('next',20)}</button>
  </div>` + tabbar('DRV-01');
};

function timeline(c){
  const at = NEXT[Math.min(c.stage,8)];
  const curIdx = c.stage >= 9 ? 4 : at[1];
  const rec = EV.slice(0, Math.max(c.stage-1, 0));
  if (c.stage >= 9) rec.push(EV[7]);
  const pendFrom = c.st === 'offline' ? Math.max(rec.length - 2, 0) : 99;
  return `<div class="tl">${STOPS.map((s,i) => {
    const done = i < curIdx, cur = i === curIdx;
    const evs = rec.map((e,k) => ({e,k})).filter(x => x.e.stop === i);
    const tags = evs.map(({e,k}) => `<span class="chip${k>=pendFrom?' dark':''}">${k>=pendFrom ? ic('upload',14)+' Chờ gửi · ' : ''}${e.short} ${e.time}</span>`).join('');
    const state = cur ? (at[4] ? 'Đang ở đây' : 'Kế tiếp') : '';
    return `<div class="stop"><div class="rail"><span class="dot ${done?'done':cur?'cur':''}">${done?ic('check',10,4):''}</span>${i<STOPS.length-1?`<span class="ln ${done?'done':''}"></span>`:''}</div>
      <div class="info"><div class="row between"><b>${s.name}</b><span class="small muted">${s.plan}</span></div><span class="small muted">${s.type}${state?' · <b style="color:var(--w-ink)">'+state+'</b>':''}</span>${tags?`<div class="ev">${tags}</div>`:''}</div></div>`;
  }).join('')}</div>`;
}

function mainButton(c){
  if (c.stage === 0) return `<button class="btn pri xl grow" data-act="main">Kiểm tra trước chuyến</button>`;
  const e = EV[c.stage-1];
  return `<button class="btn pri xl grow" data-act="main">${e.btn}</button>`;
}

R['DRV-02'] = c => {
  if (c.trip === 'b') return notReady(c);
  const head = hdr({back:true, title:'HR-2610-0012', sub:orderStatus(c), right:`<button class="ib" data-act="sheet" data-arg="menu" aria-label="Thêm">${ic('more',26)}</button>`});
  if (c.st === 'loading' && !c.sheet) return sb(c) + head + skeletonBody() + `<div class="bottom"><div class="row"><div class="skel" style="height:64px;flex:1;border-radius:14px"></div></div>${hi()}</div>`;
  if (c.st === 'error' && !c.sheet) return sb(c) + head + `<div class="body white"><div class="empty"><div class="circle">${ic('alert',32)}</div><b style="font-size:18px">Không tải được chuyến</b><p class="muted small" style="margin:0;max-width:290px">Đang hiện bản lưu lúc 05:34 nếu có. Kiểm tra kết nối rồi thử lại.</p><button class="btn pri" data-act="noop">${ic('refresh',20)} Thử lại</button><button class="btn ghost" data-act="sheet" data-arg="call">${ic('phone',20)} Gọi điều phối</button></div></div>` + hi();
  const n = NEXT[Math.min(c.stage,8)];
  let gpsTxt = c.stage < 2 ? 'GPS bật khi bắt đầu chuyến' : c.gps === 'inapp' ? 'GPS chỉ gửi khi app đang mở · Mở Cài đặt' : 'GPS đang chia sẻ · gửi lần cuối 1 phút trước';
  const strip = c.st === 'offline' ? offlineBar(c, `Mất sóng · ${pendingCount(c)} mục chờ gửi · GPS vẫn ghi trên máy`) : `<div class="bar light">${ic('gps',18)}<span class="grow">${gpsTxt}</span></div>`;
  const body = `<div class="body">
    <div class="card brand" style="gap:6px">
      <span class="lbl">${n[0]}</span>
      <span class="big">${STOPS[n[1]].name}</span>
      <div class="row between small" style="flex-wrap:wrap"><span class="muted">${n[2]}</span>${n[3]?`<span class="chip ${n[3].startsWith('Trễ')?'dark':''}">${n[3]}</span>`:''}</div>
    </div>
    <div class="card" style="padding:4px 16px">
      <button class="listrow" data-act="go" data-arg="DRV-10">${ic('horse',22)}<span class="grow"><b>2 ngựa · Sao Mai, Kim Long</b><span class="small muted">Người nhận: Trạm kiểm dịch Svay Rieng</span></span>${ic('next',20)}</button>
      <div class="listrow" style="cursor:default">${ic('truck',22)}<span class="grow"><b>51C-482.17</b><span class="small muted">Xe tải 4 chuồng · Hộ tống: Phạm Thị Thu</span></span></div>
      <button class="listrow" data-act="sheet" data-arg="call">${ic('phone',22)}<span class="grow"><b>Gọi điều phối</b><span class="small muted">Võ Quốc Bảo · 1900 6868</span></span>${ic('next',20)}</button>
    </div>
    <div class="card"><div class="row between"><span class="lbl">Lộ trình</span><button class="link small" data-act="go" data-arg="DRV-05">Xem bản đồ</button></div>${timeline(c)}</div>
  </div>`;
  const undo = c.undo ? `<div class="undo" role="status"><span class="grow">Đã ghi: ${c.undo.short} ${STOPS[c.undo.stop].name} lúc ${c.undo.time}</span><button data-act="undo">${ic('undo',18)} Hoàn tác ${c.undo.left}</button></div>` : '';
  const bottom = `<div class="bottom">${undo}<div class="row"><button class="btn side xl" data-act="incident">${ic('alert',22)}<span>Báo sự cố</span></button>${mainButton(c)}</div>${hi()}</div>`;
  return sb(c) + head + strip + body + bottom + overlay(c);
};

function notReady(c){
  return sb(c) + hdr({back:true, title:'HR-2611-0003', sub:'Đang chuẩn bị'}) + `<div class="bar light">${ic('clock',18)}<span class="grow">Chuyến chưa sẵn sàng · bạn vẫn xem được kế hoạch</span></div>
  <div class="body">
    <div class="card" style="gap:6px"><span class="lbl">Khởi hành từ</span><span class="big">Trường đua Phú Thọ</span><span class="small muted">Kế hoạch 12/11 · 05:30</span></div>
    <div class="card" style="padding:4px 16px">
      <div class="listrow" style="cursor:default">${ic('horse',22)}<span class="grow"><b>1 ngựa · Bạch Phong</b><span class="small muted">Arabian · đực · xám</span></span></div>
      <div class="listrow" style="cursor:default">${ic('truck',22)}<span class="grow"><b>Xe tải 2 chuồng</b><span class="small muted">Biển số do điều phối gán khi chốt kế hoạch</span></span></div>
    </div>
    <div class="card"><span class="lbl">Lộ trình</span><div class="tl">
      <div class="stop"><div class="rail"><span class="dot"></span><span class="ln"></span></div><div class="info"><div class="row between"><b>Trường đua Phú Thọ</b><span class="small muted">05:30</span></div><span class="small muted">Điểm xuất phát</span></div></div>
      <div class="stop"><div class="rail"><span class="dot"></span></div><div class="info"><div class="row between"><b>Sân bay Tân Sơn Nhất</b><span class="small muted">06:40</span></div><span class="small muted">Sân bay · điểm giao · 9 km</span></div></div>
    </div></div>
  </div>
  <div class="bottom"><div class="note">Bạn sẽ nhận thông báo khi quản lý chuyển chuyến cho tài xế.</div><div class="row"><button class="btn side xl" data-act="incident">${ic('alert',22)}<span>Báo sự cố</span></button><button class="btn pri xl grow" disabled>Chờ quản lý chuyển chuyến</button></div>${hi()}</div>`;
}

function overlay(c){
  if (c.sheet === 'confirm') return confirmSheet(c);
  if (c.sheet === 'menu') return sheetWrap(`<h3>Chuyến HR-2610-0012</h3><div style="display:flex;flex-direction:column">
      <button class="listrow" data-act="sheet" data-arg="other">${ic('list',22)}<span class="grow"><b>Ghi mốc khác</b><span class="small muted">Khi quên ghi hoặc ghi khác thứ tự</span></span>${ic('next',20)}</button>
      <button class="listrow" data-act="go" data-arg="DRV-10">${ic('horse',22)}<span class="grow"><b>Ngựa và giao nhận</b></span>${ic('next',20)}</button>
      <button class="listrow" data-act="go" data-arg="DRV-05">${ic('map',22)}<span class="grow"><b>Bản đồ chuyến</b></span>${ic('next',20)}</button>
      <button class="listrow" data-act="sheet" data-arg="call">${ic('phone',22)}<span class="grow"><b>Gọi điều phối</b></span>${ic('next',20)}</button>
    </div><button class="btn" data-act="close">Đóng</button>`);
  if (c.sheet === 'other') return sheetWrap(`<h3>Ghi mốc khác</h3><p class="small muted" style="margin:0">Chọn loại mốc, bước sau chọn điểm dừng và giờ.</p><div style="display:flex;flex-direction:column">
      ${['Đã đến điểm dừng','Rời điểm dừng','Đã thông quan','Đã giao ngựa'].map(t => `<button class="listrow" data-act="close"><span class="grow"><b>${t}</b></span>${ic('next',20)}</button>`).join('')}
    </div><button class="btn" data-act="close">Đóng</button>`);
  if (c.sheet === 'call') return sheetWrap(`<h3>Gọi điều phối</h3><div class="kvw"><div><span>Điều phối chuyến</span><b>Võ Quốc Bảo</b></div><div><span>Đường dây nóng</span><b style="font-size:22px">1900 6868</b></div></div><a class="btn pri xl" href="tel:19006868">${ic('phone',22)} Gọi 1900 6868</a><button class="btn" data-act="close">Đóng</button>`);
  if (c.sheet === 'queue') return queueSheet(c);
  return '';
}
function sheetWrap(inner){ return `<div class="overlay"><div class="sheet"><span class="grab"></span>${inner}${hi()}</div></div>`; }

function confirmSheet(c){
  const e = EV[Math.max(c.stage-1,0)];
  const T = {
    DEPARTED:['Bắt đầu chuyến?','Xác nhận bắt đầu', c.gps==='inapp' ? 'GPS chỉ gửi khi app đang mở. Bật "Luôn cho phép" trong Cài đặt để điều phối thấy xe liên tục.' : 'GPS nền bật và gửi vị trí cho điều phối đến khi giao xong.'],
    CUSTOMS_CLEARED:['Xác nhận đã thông quan?','Xác nhận đã thông quan','Khách hàng thấy mốc này trên hành trình.'],
    DELIVERED:['Xác nhận đã giao ngựa?','Xác nhận đã giao','Chuyến kết thúc và GPS tắt. Kiểm tra lại: Sao Mai và Kim Long đã giao cho người nhận.']
  }[e.ms] || ['Xác nhận mốc?','Xác nhận',''];
  const timeRow = c.editTime
    ? `<div class="sec"><span class="lbl">Giờ ghi <em>· sửa được trong 24 giờ</em></span><div class="stepper"><button class="ib" data-act="noop" aria-label="Lùi 5 phút">−5</button><b>${e.time}</b><button class="ib" data-act="noop" aria-label="Thêm 5 phút">+5</button></div></div>`
    : '';
  const err = c.st === 'error' ? `<div class="box err">${ic('alert',22)}<div style="display:flex;flex-direction:column;gap:6px"><b>Chưa ghi được mốc</b><span>Chuyến chưa đủ điều kiện xuất phát: thiếu giấy kiểm dịch của Kim Long.</span><button class="link" data-act="sheet" data-arg="call" style="align-self:flex-start">Gọi điều phối</button></div></div>` : '';
  const off = c.st === 'offline' ? `<div class="box">${ic('wifioff',22)}<span>Đang mất sóng. Mốc lưu trên máy và tự gửi khi có sóng.</span></div>` : '';
  return sheetWrap(`<h3>${T[0]}</h3>
    <div class="kvw"><div><span>Điểm</span><b>${STOPS[e.stop].name}</b></div><div><span>Giờ ghi</span><span class="row"><b>${e.time} hôm nay</b>${c.editTime?'':'<button class="link small" data-act="editTime">Sửa giờ</button>'}</span></div></div>
    ${timeRow}${err}${off}
    <p class="small muted" style="margin:0">${T[2]}</p>
    <button class="btn pri xl" data-act="confirm">${T[1]}</button>
    <button class="btn ghost" data-act="close">Huỷ</button>`);
}
function queueSheet(c){
  const rows = [];
  const rec = EV.slice(0, Math.max(c.stage-1,0));
  rec.slice(-2).forEach(e => rows.push(['Mốc', `${e.short} ${STOPS[e.stop].name}`, `ghi ${e.time}`]));
  rows.push(['Vị trí GPS', '46 điểm', 'từ 07:12']);
  if (c.incSent) rows.push(['Sự cố', 'Hỏng xe · Nghiêm trọng', '2 ảnh']);
  return sheetWrap(`<h3>Chờ gửi (${rows.length})</h3>
    <div class="kvw">${rows.map(r => `<div><span>${r[0]}</span><span style="text-align:right"><b>${r[1]}</b><br><span class="small muted">${r[2]}</span></span></div>`).join('')}</div>
    <p class="small muted" style="margin:0">Tự gửi khi có sóng. Không đăng xuất khi còn mục chờ gửi.</p>
    <button class="btn pri xl" data-act="close">${ic('upload',22)} Gửi lại ngay</button>
    <button class="btn ghost" data-act="close">Đóng</button>`);
}

R['DRV-03'] = c => {
  const done = CHECKS.filter(k => c.checks[k.id]).length;
  const dlg = c.dialog === 'checks' ? `<div class="overlay center"><div class="dialog"><h3>Còn ${5-done} mục chưa kiểm tra</h3><p style="margin:0" class="muted">${CHECKS.filter(k=>!c.checks[k.id]).map(k=>k.label).join('; ')}. Vẫn tiếp tục?</p><button class="btn pri" data-act="checksAnyway">Vẫn tiếp tục</button><button class="btn" data-act="closeDialog">Kiểm tra tiếp</button></div></div>` : '';
  return sb(c) + hdr({back:true, title:'Kiểm tra trước chuyến', sub:`HR-2610-0012 · ${done}/5 mục`}) + `<div class="body white">
    <div style="display:flex;flex-direction:column">${CHECKS.map(k => `<button class="listrow" style="min-height:64px" data-act="check" data-arg="${k.id}" aria-pressed="${!!c.checks[k.id]}"><span class="chk ${c.checks[k.id]?'on':''}">${c.checks[k.id]?ic('check',18,3):''}</span><span class="grow" style="font-size:16px">${k.label}</span></button>`).join('')}</div>
    <p class="small muted" style="margin:0">Danh sách lưu trên máy này. Lần sau mở lại chuyến vẫn giữ các mục đã tick.</p>
  </div>
  <div class="bottom"><div class="row">${done<5?`<button class="btn grow" data-act="checkAll">Đã kiểm tra tất cả</button>`:''}<button class="btn pri grow" data-act="checksDone">Xong</button></div>${hi()}</div>` + dlg;
};

};

  const err = c.st === 'error';

    <div class="row between"><span class="row">${sevMark(s.n)}<b>${t.label} · ${s.label}</b></span><button class="link small" data-act="back">Đổi</button></div>
    <div class="sec"><span class="lbl">Cụ thể</span><div class="opts">${SUBS[t.id].map(([id,l]) => `<button class="opt${i.sub===id?' on':''}" data-act="incSub" data-arg="${id}">${i.sub===id?ic('check',16,3):''}${l}</button>`).join('')}</div></div>
    <div class="sec"><span class="lbl">Hư hại</span><div class="opts">${[['VEHICLE','Xe'],['HORSE','Ngựa'],['BOTH','Cả hai']].map(([id,l]) => `<button class="opt${i.dmg===id?' on':''}" data-act="incDmg" data-arg="${id}">${i.dmg===id?ic('check',16,3):''}${l}</button>`).join('')}</div></div>
    <div class="sec"><span class="lbl">Ngựa liên quan <em>${med?'· bắt buộc':'· nếu có'}</em></span><div class="opts">${['Sao Mai','Kim Long'].map(h => `<button class="opt${i.horse===h?' on':''}" data-act="incHorse" data-arg="${h}">${i.horse===h?ic('check',16,3):''}${h}</button>`).join('')}</div>${med && !i.horse ? '<span class="small" style="font-weight:600">Chọn ngựa để gửi báo cáo y tế.</span>' : ''}</div>
    <div class="sec"><span class="lbl">Mô tả</span>
      <div class="field${err&&!i.desc?' err':''}">${i.desc ? `<span>${esc(i.desc)}</span>` : '<span class="ph">Mô tả ngắn chuyện xảy ra (ít nhất 5 ký tự)</span>'}<div class="row between"><span class="small muted">${i.desc.length}/2000</span><button class="ib" data-act="noop" aria-label="Đọc bằng giọng nói" style="border:1.5px solid var(--w-line)">${ic('mic',22)}</button></div></div>
      <div class="opts">${SAMPLES[t.id].map((x,k) => `<button class="opt small" data-act="incSample" data-arg="${k}" style="min-height:40px;font-size:13px">${x}</button>`).join('')}</div>
    </div>
    <div class="sec"><span class="lbl">Ảnh <em>· tối đa 3</em></span><div class="photos">${photos}${i.photos<3?`<button class="addph" data-act="incPhoto">${ic('camera',24)}Chụp ảnh</button>`:''}</div>
      ${err ? `<div class="box err">${ic('alert',20)}<span>Ảnh 2 lớn hơn 5 MB và không nén được. Chụp lại hoặc bỏ ảnh này.</span></div>` : ''}</div>
    <div class="row small muted">${ic('pin',18)} QL22, gần Gò Dầu, Tây Ninh · lấy từ GPS</div>
  </div>
  <div class="bottom"><div class="row"><button class="btn pri xl grow" data-act="incSubmit" ${ready?'':'disabled'}>Gửi báo cáo</button></div>${hi()}</div>`;
};

R['DRV-08'] = c => {
  const i = c.inc; const off = c.st === 'offline';
  const t = INC_TYPES.find(x => x.id === i.type) || INC_TYPES[0];
  const s = SEVS.find(x => x.id === i.sev) || SEVS[0];
  const urgent = s.id === 'RED' || off;
  return sb(c) + `<div class="body white"><div class="empty" style="justify-content:flex-start;padding-top:48px">
      <div class="circle ${off?'':'fill'}">${off ? ic('upload',32) : ic('check',34,3)}</div>
      <span class="big">${off ? 'Đã lưu trên máy' : 'Đã gửi cho điều phối'}</span>
      <p class="muted" style="margin:0;max-width:300px">${off ? 'Báo cáo sẽ tự gửi khi có sóng. Đừng gỡ app.' : 'Mã sự cố SC-0457 · gửi lúc 07:41. Bạn nhận thông báo khi điều phối tiếp nhận.'}</p>
    </div>
    <div class="kvw"><div><span>Sự cố</span><b>${t.label} · ${s.label}</b></div><div><span>Vị trí</span><b>QL22, gần Gò Dầu</b></div><div><span>Ảnh</span><b>${i.photos} ảnh</b></div></div>
    ${urgent ? `<div class="box err">${ic('alert',22)}<span>${s.id==='RED' ? 'Sự cố nghiêm trọng: gọi điều phối ngay sau khi gửi.' : 'Chưa gửi được: gọi điều phối nếu cần xử lý gấp.'}</span></div>` : ''}
  </div>
  <div class="bottom"><div class="row" style="flex-direction:column">${urgent ? `<a class="btn pri xl" href="tel:19006868">${ic('phone',22)} Gọi điều phối 1900 6868</a><button class="btn" data-act="backTrip">Về chuyến</button>` : `<button class="btn pri xl" data-act="backTrip">Về chuyến</button><button class="btn ghost" data-act="sheet" data-arg="call">Gọi điều phối</button>`}</div>${hi()}</div>` + (c.sheet==='call' ? overlay(c) : '');
};

R['DRV-13'] = c => {
  const off = c.st === 'offline';
  return sb({...c, stage:9}) + `<div class="body white"><div class="empty" style="justify-content:flex-start;padding-top:40px;flex:none">
      <div class="circle fill">${ic('check',34,3)}</div>
      <span class="big">Đã giao 2 ngựa</span>
      <p class="muted" style="margin:0">10:40, 05/11/2026 · Trạm kiểm dịch Svay Rieng</p>
    </div>
    <div class="kvw">
      <div><span>Đơn</span><b>HR-2610-0012</b></div>
      <div><span>Ngựa</span><b>Sao Mai, Kim Long</b></div>
      <div><span>Quãng đường</span><b>128 km · 4 giờ 36 phút</b></div>
      <div><span>Mốc đã ghi</span><b>8</b></div>
      <div><span>Sự cố</span><b>${c.incSent ? '1 · ' + (INC_TYPES.find(x => x.id === c.inc.type) || INC_TYPES[0]).label : 'Không có'}</b></div>
      <div><span>Vị trí</span><b>Đã tắt chia sẻ</b></div>
    </div>
    ${off ? `<div class="box">${ic('upload',22)}<span>Còn ${pendingCount({...c,stage:3})} mục chờ gửi. Giữ app mở khi có sóng, không đăng xuất.</span></div>` : ''}
  </div>
  <div class="bottom"><div class="row"><button class="btn pri xl grow" data-act="tab" data-arg="DRV-01">Về danh sách chuyến</button></div>${hi()}</div>`;
};

function stub(code){
  return c => {
    const [name, why] = STUBS[code];
    const isTab = TABS.some(t => t[0] === code);
    return sb(c) + (isTab ? `<div class="hdr big"><div class="t"><b>${name}</b></div></div>` : hdr({back:true, title:name})) + `<div class="body white"><div class="empty"><span class="stubtag">${code} · ${why}</span><b style="font-size:18px">${name}</b><p class="small muted" style="margin:0;max-width:260px">Màn này có trong danh sách 02-screens.md nhưng chưa vẽ ở đợt Tài xế P0.</p></div></div>` + (isTab ? tabbar(code) : hi());
  };
}
Object.keys(STUBS).forEach(k => R[k] = stub(k));

/* ---------- Khung ---------- */
function screenHTML(code, c, id){
  const inner = R[code](c);
  const needsTop = !inner.startsWith('<div class="sb"');
  const withTabs = inner.includes('class="tabbar"');
  return `<section class="screen ${plat}" id="${id||code}" data-screen="${code}" style="--fw:${DIM[plat].w}px;--fh:${DIM[plat].h}px">${needsTop?sb(c):''}${inner}${withTabs?hi():''}</section>`;
}
function fit(html, s){
  const d = DIM[plat];
  return `<div class="fit" style="width:${Math.round(d.w*s)}px;height:${Math.round(d.h*s)}px"><div class="scaled" style="transform:scale(${s})">${html}</div></div>`;
}
function protoScale(){
  const d = DIM[plat], pad = plat==='ios'?24:20;
  const avail = Math.min(document.documentElement.clientWidth - 32, 900);
  return Math.min(1, avail / (d.w + pad));
}

/* ---------- Biến thể cho chế độ Xem tất cả ---------- */
const FILLED = {type:'VEHICLE_BREAKDOWN',sev:'RED',sub:'TIRE_BURST',dmg:'VEHICLE',horse:null,desc:'Nổ lốp sau bên phải, xe đã dừng ở lề',photos:2};
const GRID = [
  ['DRV-01',[{l:'Bình thường'},{l:'Đang tải',st:'loading'},{l:'Trống',st:'empty'},{l:'Lỗi',st:'error'},{l:'Mất sóng, chuyến đang chạy',st:'offline',stage:3}]],
  ['DRV-02',[{l:'Sẵn sàng, chưa kiểm tra',stage:0},{l:'Đã kiểm tra, sẵn sàng bắt đầu',stage:1},{l:'Đang tới điểm dừng',stage:2},{l:'Vừa ghi Đã đến, còn Hoàn tác 5 giây',stage:3,undo:{...EV[1],left:5}},{l:'Tại cửa khẩu, chờ thông quan',stage:5},{l:'Tại điểm giao',stage:8},{l:'Mất sóng, 2 mốc chờ gửi',stage:4,st:'offline'},{l:'Đang tải',st:'loading',stage:2},{l:'Lỗi tải',st:'error',stage:2},{l:'Chuyến chưa sẵn sàng',trip:'b'}]],
  ['DRV-03',[{l:'Đang kiểm tra 3/5'},{l:'Bấm Xong khi còn mục chưa tick',dialog:'checks'},{l:'Đủ 5/5',checks:ALL_CHECKS}]],
  ['COM-07',[{l:'Giải thích trước khi hệ điều hành hỏi',stage:1}]],
  ['DRV-04',[{l:'Bắt đầu chuyến',stage:1},{l:'Đã thông quan, đang sửa giờ',stage:5,editTime:true},{l:'Xác nhận đã giao',stage:8},{l:'Lỗi 409 từ máy chủ',stage:1,st:'error'},{l:'Mất sóng',stage:5,st:'offline'}]],
  ['DRV-06',[{l:'Chưa chọn',stage:3},{l:'Đã chọn loại và mức',stage:3,inc:{...newInc(),type:'VEHICLE_BREAKDOWN',sev:'RED'}}]],
  ['DRV-07',[{l:'Đang điền',stage:3,inc:FILLED},{l:'Y tế ngựa, chưa chọn ngựa',stage:3,inc:{...newInc(),type:'HORSE_MEDICAL',sev:'ORANGE',sub:'COLIC',dmg:'HORSE',desc:'Ngựa cào chân, đổ mồ hôi',photos:1}},{l:'Lỗi ảnh',stage:3,st:'error',inc:FILLED},{l:'Mất sóng',stage:3,st:'offline',inc:FILLED}]],
  ['DRV-08',[{l:'Đã gửi',stage:3,inc:FILLED},{l:'Lưu chờ gửi (mất sóng)',stage:3,st:'offline',inc:FILLED,incSent:true}]],
  ['DRV-13',[{l:'Hoàn tất',stage:9},{l:'Còn mục chờ gửi',stage:9,st:'offline'}]],
  ['COM-12',[{l:'Hàng chờ đồng bộ',stage:4,st:'offline',incSent:true}]]
];

/* ---------- Vẽ trang ---------- */
const main = document.getElementById('main');
function render(){
  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('#segPlat button').forEach(b => b.classList.toggle('on', b.dataset.plat === plat));
  document.querySelectorAll('#segState button').forEach(b => b.classList.toggle('on', b.dataset.st === app.st));
  document.getElementById('grpScale').hidden = mode !== 'grid';
  document.querySelector('#segState').closest('.grp').hidden = mode === 'grid';
  if (mode === 'grid') return renderGrid();
  const code = app.screen, n = NOTES[code];
  const s = protoScale(), d = DIM[plat], pad = plat==='ios'?12:10;
  const dev = `<div class="device ${plat}">${screenHTML(code, app)}</div>`;
  const devFit = s < 1 ? `<div class="fit" style="width:${Math.round((d.w+pad*2)*s)}px;height:${Math.round((d.h+pad*2)*s)}px"><div class="scaled" style="transform:scale(${s})">${dev}</div></div>` : dev;
  const stub = STUBS[code];
  const info = n ? `<div class="pcard"><h3>${code} · ${n.kind}</h3><h2>${n.n}</h2><p>${n.p}</p>
      <dl class="kv"><dt>Hành động chính</dt><dd>${n.a}</dd><dt>Dữ liệu</dt><dd>${n.d}</dd><dt>API</dt><dd class="code">${n.api}</dd></dl>
      <ul>${n.b.map(x => `<li>${x}</li>`).join('')}</ul></div>`
    : `<div class="pcard"><h3>${code}</h3><h2>${stub[0]}</h2><p>${stub[1]}.</p></div>`;
  const stageCtl = (code === 'DRV-02' && app.trip === 'a') ? `<div class="pcard"><h3>Nhảy tới bước trong chuyến</h3><div class="jump">${['Chưa kiểm tra','Sẵn sàng','Tới Trảng Bàng','Ở Trảng Bàng','Tới Mộc Bài','Ở cửa khẩu','Đã thông quan','Tới Svay Rieng','Ở điểm giao'].map((l,k) => `<button data-stage="${k}" class="${app.stage===k?'on':''}">${l}</button>`).join('')}</div></div>` : '';
  const list = ['DRV-01','DRV-02','DRV-03','COM-07','DRV-04','DRV-06','DRV-07','DRV-08','DRV-13','COM-12'];
  const jump = `<div class="pcard"><h3>Màn đã vẽ (P0)</h3><div class="jump">${list.map(k => `<button data-jump="${k}" class="${app.screen===k?'on':''}"><span class="code">${k}</span>${NOTES[k].n}</button>`).join('')}</div>
    <p class="hint">Bấm vào nút trong khung để đi theo luồng. Thanh Trạng thái phía trên đổi màn hiện tại sang Đang tải, Trống, Lỗi hoặc Mất sóng.</p></div>`;
  main.innerHTML = `<div class="proto"><div>${devFit}</div><div class="panel">${info}${stageCtl}${jump}</div></div>`;
}
function renderGrid(){
  const s = gridScale || (document.documentElement.clientWidth >= 1100 ? 1 : 0.5);
  document.querySelectorAll('#segScale button').forEach(b => b.classList.toggle('on', +b.dataset.sc === s));
  main.innerHTML = `<div class="grid">${GRID.map(([code, vs]) => {
    const n = NOTES[code];
    return `<section class="grow-row"><header><h2>${code} · ${n.n}</h2><p>${n.p} Hành động chính: ${n.a}.</p></header><div class="strip">${vs.map((v,k) => {
      const c = {...fresh(), ...v, st:v.st||'normal', checks:v.checks||fresh().checks, inc:v.inc||newInc()};
      return `<div class="vcell"><span class="vl">${v.l}</span><div data-open="${code}" data-v="${k}">${fit(screenHTML(code, c, k ? `${code}--${k}` : code), s)}</div></div>`;
    }).join('')}</div></section>`;
  }).join('')}</div>`;
}

/* ---------- Hành động ---------- */
function go(code){ app.stack.push(app.screen); app.screen = code; app.sheet = null; app.dialog = null; }
function stopUndo(){ clearInterval(undoTimer); undoTimer = null; app.undo = null; }
const ACT = {
  noop(){},
  go(a){ go(a); },
  back(){ app.sheet = null; app.dialog = null; app.screen = app.stack.pop() || 'DRV-01'; },
  tab(a){ stopUndo(); app.stack = []; app.screen = a; app.sheet = null; if (a==='DRV-01' && app.stage>=9) { app.stage = 0; app.checks = fresh().checks; app.gps = null; app.incSent = false; } },
  openTrip(a){ app.trip = a; go('DRV-02'); },
  sheet(a){ app.sheet = a; },
  close(){ app.sheet = null; app.editTime = false; },
  editTime(){ app.editTime = true; },
  main(){
    if (app.stage === 0) return go('DRV-03');
    const e = EV[app.stage-1];
    if (e.kind === 'undo') {
      stopUndo(); app.stage++; app.undo = {...e, left:5};
      undoTimer = setInterval(() => { if (!app.undo) return stopUndo(); app.undo.left--; if (app.undo.left <= 0) stopUndo(); render(); }, 1000);
      return;
    }
    if (app.stage === 1 && !app.gps) return go('COM-07');
    app.sheet = 'confirm';
  },
  confirm(){
    if (app.st === 'error') return;
    app.sheet = null; app.editTime = false; stopUndo(); app.stage++;
    if (app.stage >= 9) { app.stack = []; app.screen = 'DRV-13'; }
  },
  undo(){ if (app.undo) { app.stage--; } stopUndo(); },
  check(a){ app.checks[a] = !app.checks[a]; },
  checkAll(){ app.checks = {...ALL_CHECKS}; },
  checksDone(){ const all = CHECKS.every(k => app.checks[k.id]); if (!all) { app.dialog = 'checks'; return; } app.stage = Math.max(app.stage,1); ACT.back(); },
  checksAnyway(){ app.dialog = null; app.stage = Math.max(app.stage,1); ACT.back(); },
  closeDialog(){ app.dialog = null; },
  gpsAllow(){ app.gps = 'always'; ACT.back(); app.sheet = 'confirm'; },
  gpsLater(){ app.gps = 'inapp'; ACT.back(); app.sheet = 'confirm'; },
  incident(){ stopUndo(); app.inc = newInc(); go('DRV-06'); },
  incType(a){ app.inc.type = a; app.inc.sub = null; app.inc.desc = ''; },
  incSev(a){ app.inc.sev = a; },
  incNext(){ if (app.inc.type && app.inc.sev) go('DRV-07'); },
  incSub(a){ app.inc.sub = app.inc.sub === a ? null : a; },
  incDmg(a){ app.inc.dmg = app.inc.dmg === a ? null : a; },
  incHorse(a){ app.inc.horse = app.inc.horse === a ? null : a; },
  incSample(a){ app.inc.desc = SAMPLES[app.inc.type][+a]; },
  incPhoto(){ if (app.inc.photos < 3) app.inc.photos++; },
  incSubmit(){ app.incSent = true; go('DRV-08'); },
  backTrip(){ while (app.stack.length && app.screen !== 'DRV-02') app.screen = app.stack.pop(); if (app.screen !== 'DRV-02') app.screen = 'DRV-02'; app.sheet = null; }
};

document.addEventListener('click', e => {
  const seg = e.target.closest('[data-mode],[data-plat],[data-st],[data-sc],[data-jump],[data-stage],[data-open]');
  if (seg) {
    const d = seg.dataset;
    if (d.mode) mode = d.mode;
    else if (d.plat) plat = d.plat;
    else if (d.st) app.st = d.st;
    else if (d.sc) gridScale = +d.sc;
    else if (d.stage) { stopUndo(); app.stage = +d.stage; app.sheet = null; }
    else if (d.jump) jumpTo(d.jump);
    else if (d.open) { mode = 'proto'; jumpTo(d.open); window.scrollTo(0,0); }
    render(); return;
  }
  if (mode !== 'proto') return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !main.contains(t)) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset.arg); render(); }
});
function jumpTo(code){
  stopUndo(); app.sheet = null; app.dialog = null; app.trip = 'a';
  if (code === 'DRV-04') { app.screen = 'DRV-02'; app.stack = ['DRV-01']; if (![1,5,8].includes(app.stage)) app.stage = 1; app.gps = app.gps || 'always'; app.sheet = 'confirm'; return; }
  if (code === 'COM-12') { app.screen = 'DRV-02'; app.stack = ['DRV-01']; if (app.stage < 2) app.stage = 4; app.st = 'offline'; app.sheet = 'queue'; return; }
  if (code === 'DRV-07' || code === 'DRV-08') { if (!app.inc.type) app.inc = {...FILLED}; app.stack = ['DRV-01','DRV-02','DRV-06'].concat(code==='DRV-08'?['DRV-07']:[]); app.screen = code; if (code==='DRV-08') app.incSent = true; return; }
  if (code === 'DRV-13') { app.stage = 9; app.stack = []; app.screen = code; return; }
  app.stack = code === 'DRV-01' ? [] : ['DRV-01'];
  if (code === 'DRV-06') app.stack.push('DRV-02');
  if (code === 'COM-07') app.stack.push('DRV-02');
  app.screen = code;
}
document.getElementById('btnReset').addEventListener('click', () => { stopUndo(); const st = app.st; app = fresh(); app.st = st; mode = 'proto'; render(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
render();
})();
</script>
