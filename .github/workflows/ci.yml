name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pintegration-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter api test
      # Dựng DB từ đầu bằng đúng lệnh người dùng chạy; lần chạy thứ hai phải không làm gì.
      - run: pnpm db:setup && pnpm db:setup
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: wdp_ci
          DB_USER: root
          DB_PASSWORD: integration-test-only
          DB_SSL: 'false'
      # Mọi test tích hợp MySQL, mỗi file tạo và xóa database ngẫu nhiên của riêng nó. Chạy hết rồi mới báo các file lỗi.
      # Storage provider/dir và JWT secret đặt sẵn trong từng script.
      - name: MySQL integration tests
        shell: bash
        run: |
          failed=()
          for test in apps/api/test/*.mysql.cjs; do
            echo "::group::$test"
            node "$test" || failed+=("$test")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then printf 'Lỗi: %s\n' "${failed[@]}"; exit 1; fi
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: integration-test-only
          TEST_DB_SSL: 'false'
