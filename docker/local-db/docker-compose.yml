# Bản sao database chung của nhóm, chạy trên máy từng người (thay Aiven khi không truy cập được).
# Lần đầu khởi động, MySQL nạp theo thứ tự:
#   01  cấu trúc database wdp trên Aiven lúc 15:39 ngày 10/11/2026 (40 bảng, không có dữ liệu)
#   02  dữ liệu nền do migration của code tạo (danh sách migration, 3 loại giấy tờ, tham số, bảng giá)
# Sau đó `pnpm db:local` chạy các migration mới hơn nếu có. Xem docs/db-local-copy.md.
#   pnpm db:local          khởi động
#   pnpm db:local:reset    xóa dữ liệu trên máy mình và nạp lại từ đầu
name: wdp-local-db
services:
  mysql:
    image: mysql:8.0
    container_name: wdp-local-db
    ports: ["${LOCAL_DB_PORT:-3307}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: wdp-local
      MYSQL_DATABASE: wdp
      TZ: UTC
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - wdp-local-db-data:/var/lib/mysql
      - ./01-schema-20261110.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./02-reference-data.sql:/docker-entrypoint-initdb.d/02-reference-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pwdp-local"]
      interval: 5s
      retries: 30
volumes:
  wdp-local-db-data:
    name: wdp-local-db-data
